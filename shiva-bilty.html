<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIVA SHAKTHI ROAD TRANSPORT - Bilty</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#f4f7fb url('shiva-parvathi-background.jpg') center/cover fixed;color:#172033}.top{background:#073b8f;color:#fff;padding:15px}.top a{color:#fff;margin-right:12px}.wrap{max-width:1100px;margin:18px auto;padding:10px}.box{background:#fffffff0;padding:16px;border-radius:10px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:block;font-weight:bold;font-size:12px;margin-bottom:4px}input,select,textarea{width:100%;padding:10px;border:1px solid #bbc5d1;border-radius:6px}.full{grid-column:1/-1}button{padding:10px 14px;border:0;border-radius:6px;font-weight:bold;margin:4px;cursor:pointer}.blue{background:#0756a6;color:white}.yellow{background:#ffd21f}.green{background:#16803c;color:white}.red{background:#b91c1c;color:white}.msg{font-weight:bold;margin-top:8px}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:420px){.grid{grid-template-columns:1fr}}@media print{@page{size:A4 portrait;margin:8mm}.top,.noprint{display:none!important}.wrap{margin:0;padding:0}.copy{height:91mm;border:1px solid #333;padding:8px;margin-bottom:2mm;page-break-inside:avoid}.copy h2{margin:0;font-size:17px}.meta{display:flex;justify-content:space-between;border-block:1px solid #555;padding:7px 0}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0}.charges{border-top:1px solid #555;padding-top:6px;display:flex;justify-content:space-between}.printarea{display:block!important}}.printarea{display:none}</style></head><body><div class="top"><b>SHIVA SHAKTHI ROAD TRANSPORT — ONLINE BILTY / LR</b><div><a href="bilty.html">NRT Bilty</a><a href="shiva-reports.html">Reports</a></div></div><div class="wrap"><div class="box" id="login"><h2>SHIVA SHAKTHI Staff Login</h2><div class="grid"><div><label>Email</label><input id="email" type="email"></div><div><label>Password</label><input id="password" type="password"></div></div><button class="blue" onclick="doLogin()">Login</button><div id="loginMsg"></div></div><div class="box" id="app" style="display:none"><h2>New / Edit Bilty</h2><div class="grid"><div><label>LR Number</label><input id="lr_no" readonly></div><div><label>Date</label><input id="lr_date" type="date"></div><div><label>Freight Type</label><select id="freight_type"><option>TO PAY</option><option>PAID</option><option>ON ACCOUNT</option></select></div><div><label>From</label><input id="from_location" value="HYDERABAD"></div><div><label>To</label><input id="to_location"></div><div><label>Consignor Name</label><input id="consignor_name" list="parties"></div><div><label>Consignor Phone</label><input id="consignor_phone"></div><div><label>Consignee Name</label><input id="consignee_name" list="parties"></div><div><label>Consignee Phone</label><input id="consignee_phone"></div><div><label>Quantity</label><input id="packages" type="number" value="0"></div><div><label>Weight</label><input id="weight" type="number" value="0"></div><div class="full"><label>Goods / Description</label><input id="goods"></div><div><label>Invoice Number</label><input id="invoice_no"></div><div><label>Invoice Value</label><input id="invoice_value" type="number" value="0"></div><div><label>Freight</label><input id="freight" type="number" value="0"></div><div><label>Hamali Charge</label><input id="hamali" type="number" value="0"></div><div><label>LR Charge</label><input id="other_charges" type="number" value="0"></div><div class="full"><label>Remarks</label><textarea id="remarks"></textarea></div></div><datalist id="parties"></datalist><div class="noprint"><button class="blue" onclick="saveLR()">Save Bilty</button><button class="yellow" onclick="printLR()">Print / PDF</button><button onclick="clearForm()">Clear</button><button class="green" onclick="location.href='shiva-reports.html'">Reports</button><button class="red" onclick="logout()">Logout</button></div><div id="msg"></div></div><div id="printArea" class="printarea"></div></div><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),money=n=>'₹'+Number(n||0).toLocaleString('en-IN');async function doLogin(){let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginMsg').textContent=r.error.message;return}show()}async function logout(){await sb.auth.signOut();location.reload()}async function nextLR(){let r=await sb.from('lrs').select('lr_no').like('lr_no','SST/%').limit(1000);if(r.error)throw r.error;let m=0;(r.data||[]).forEach(x=>{let n=String(x.lr_no||'').match(/^SST\/(\d+)$/);if(n)m=Math.max(m,+n[1])});return 'SST/'+String(m+1).padStart(5,'0')}async function show(){$('login').style.display='none';$('app').style.display='block';$('lr_date').value=today();$('lr_no').value=await nextLR();let r=await sb.from('lrs').select('lr_no,consignor_name,consignor_phone,consignee_name,consignee_phone,to_location').like('lr_no','SST/%').limit(5000),p={},a={};(r.data||[]).forEach(x=>{if(x.consignor_name)p[x.consignor_name]=x.consignor_phone||'';if(x.consignee_name){p[x.consignee_name]=x.consignee_phone||'';if(x.to_location)a[x.consignee_name]=x.to_location}});$('parties').innerHTML=Object.keys(p).map(n=>`<option value="${n.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">`).join('');$('consignee_name').addEventListener('change',()=>{let n=$('consignee_name').value,k=Object.keys(p).find(x=>x.toLowerCase()===n.toLowerCase());if(k)$('consignee_phone').value=p[k];let ak=Object.keys(a).find(x=>x.toLowerCase()===n.toLowerCase());if(ak)$('to_location').value=a[ak]});$('consignor_name').addEventListener('change',()=>{let n=$('consignor_name').value,k=Object.keys(p).find(x=>x.toLowerCase()===n.toLowerCase());if(k)$('consignor_phone').value=p[k]})}function row(){return{lr_no:$('lr_no').value,lr_date:$('lr_date').value,from_location:$('from_location').value,to_location:$('to_location').value,freight_type:$('freight_type').value,consignor_name:$('consignor_name').value,consignor_phone:$('consignor_phone').value,consignee_name:$('consignee_name').value,consignee_phone:$('consignee_phone').value,packages:+$('packages').value||0,weight:+$('weight').value||0,goods:$('goods').value,invoice_no:$('invoice_no').value,invoice_value:+$('invoice_value').value||0,freight:+$('freight').value||0,hamali:+$('hamali').value||0,other_charges:+$('other_charges').value||0,remarks:$('remarks').value,status:'Booked'}}async function saveLR(){let x=row(),r=await sb.from('lrs').insert(x);if(r.error){$('msg').textContent=r.error.message;return}$('msg').textContent=x.lr_no+' saved successfully';printLR();setTimeout(async()=>$('lr_no').value=await nextLR(),500)}function clearForm(){['to_location','consignor_name','consignor_phone','consignee_name','consignee_phone','goods','invoice_no','remarks'].forEach(i=>$(i).value='');['packages','weight','invoice_value','freight','hamali','other_charges'].forEach(i=>$(i).value=0);$('lr_date').value=today();nextLR().then(x=>$('lr_no').value=x)}function printLR(){let x=row(),tot=(+x.freight||0)+(+x.hamali||0)+(+x.other_charges||0);$('printArea').innerHTML=['CONSIGNOR COPY','CONSIGNEE COPY','TRANSPORT COPY'].map(c=>`<div class="copy"><div style="display:flex;justify-content:space-between"><div><h2>SHIVA SHAKTHI ROAD TRANSPORT</h2><b>ONE DAY DELIVERY SERVICE</b><div>Autonagar, Hyderabad, Telangana - 500070</div><div>Mobile: 9885410410 / 9989581732</div></div><div><b>GSTIN: 36HSYPK0996J1ZM</b><div>${c}</div><div>LR No: ${esc(x.lr_no)}</div><div>Date: ${esc(x.lr_date)}</div></div></div><div class="meta"><span>FROM: ${esc(x.from_location)}</span><span>TO: ${esc(x.to_location)}</span><span>${esc(x.freight_type)}</span></div><div class="details"><div><b>Consignor:</b> ${esc(x.consignor_name)}<br>Phone: ${esc(x.consignor_phone)}</div><div><b>Consignee:</b> ${esc(x.consignee_name)}<br>Phone: ${esc(x.consignee_phone)}</div><div><b>Invoice No:</b> ${esc(x.invoice_no)}</div><div><b>Invoice Value:</b> ${money(x.invoice_value)}</div><div><b>Description:</b> ${esc(x.goods)}</div><div><b>Quantity:</b> ${esc(x.packages)}</div><div><b>Remarks:</b> ${esc(x.remarks)}</div></div><div class="charges"><span>Freight: ${money(x.freight)}</span><span>Hamali: ${money(x.hamali)}</span><span>LR Charge: ${money(x.other_charges)}</span><b>Total: ${money(tot)}</b></div></div>`).join('');window.print()}window.addEventListener('load',async()=>{let s=await sb.auth.getSession();if(s.data.session)show()});
</script></body></html>
