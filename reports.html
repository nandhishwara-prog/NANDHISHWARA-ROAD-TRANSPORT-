<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NRT Reports</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#111827}
.top{background:#073b8f;color:#fff;padding:14px 18px}
.topin{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav button,.nav a{background:#fff;color:#073b8f;padding:9px 13px;border-radius:7px;font-weight:bold;text-decoration:none;border:0}
.wrap{max-width:1200px;margin:18px auto;padding:0 12px}
.box{background:#fff;border:1px solid #d5dbe3;border-radius:10px;padding:16px;margin-bottom:14px}
.title{color:#073b8f}
.grid{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px}
label{font-weight:bold;font-size:13px;display:block;margin-bottom:5px}
input{width:100%;padding:10px;border:1px solid #b9c2ce;border-radius:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:6px;padding:10px 16px;font-weight:bold;cursor:pointer}
.blue{background:#073b8f;color:#fff}.yellow{background:#ffd21f;color:#111}.gray{background:#6b7280;color:#fff}.green{background:#16803c;color:#fff}.red{background:#b91c1c;color:#fff}
.msg{margin-top:10px;font-weight:bold}
.ok{color:#16803c}.err{color:#b91c1c}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{border:1px solid #d5dbe3;border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:#073b8f}.stat span{font-size:12px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
th,td{border:1px solid #d5dbe3;padding:7px;font-size:12px;text-align:left}
th{background:#eef5fb;color:#073b8f}
.right{text-align:right}
.small{padding:5px 8px;font-size:11px;border-radius:4px;margin:1px;text-decoration:none;font-weight:bold;display:inline-block}
.share-menu{display:none;position:absolute;right:0;top:100%;z-index:20;background:#fff;border:1px solid #ccd4df;border-radius:7px;padding:6px;box-shadow:0 4px 14px #0003;min-width:130px}
.share-menu button{display:block;width:100%;padding:7px;margin:2px 0;background:#fff;color:#111;text-align:left;font-size:11px}
.act{white-space:nowrap;position:relative}
@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media print{
@page{size:A4 landscape;margin:10mm}
body{background:#fff}
.top,.filters,.actions,.share-menu{display:none!important}
.wrap{max-width:none;margin:0;padding:0}
.box{border:0;padding:0;margin:0 0 5mm}
.print-head{display:block!important;text-align:center;margin-bottom:4mm}
.print-company{font-size:18pt;font-weight:bold}
.print-subtitle{font-size:12pt;font-weight:bold;margin-top:2mm}
.print-period{font-size:9pt;margin-top:2mm}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:2mm;margin-bottom:4mm}
.stat{border:1px solid #777;border-radius:0;padding:2mm}
.stat b{font-size:12pt;color:#000}.stat span{font-size:8pt}
.table-wrap{overflow:visible}
table{width:100%;min-width:0;table-layout:auto}
th,td{border:1px solid #555;padding:4px 5px;font-size:8.5pt;color:#000}
th{background:#eee;color:#000}
th:last-child,td:last-child{display:none}
}
.print-head{display:none}
</style>
</head>
<body>

<div class="top">
  <div class="topin">
    <b>📊 NRT REPORTS</b>
    <div class="nav">
      <a href="bilty.html">➕ New Bilty</a>
      <a href="index.html">← Home</a>
      <button type="button" onclick="logout()">Logout</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="box filters">
    <h2 class="title">LR Reports</h2>
    <div class="grid">
      <div><label>From Date</label><input id="fromDate" type="date"></div>
      <div><label>To Date</label><input id="toDate" type="date"></div>
      <div>
        <label>Search LR / Consignor / Consignee / From / To</label>
        <input id="allSearch" type="search" placeholder="Enter any LR No, Name, From or To">
      </div>
    </div>
    <div class="actions">
      <button type="button" class="blue" onclick="loadReport()">🔎 Search</button>
      <button type="button" class="gray" onclick="clearFilters()">Clear</button>
      <button type="button" class="yellow" onclick="printReport()">🖨️ Print Sheet</button>
      <button type="button" class="green" onclick="exportExcel()">📊 Excel Sheet</button>
      <button type="button" class="red" onclick="printPDF()">📄 PDF Print</button>
      <button type="button" class="green" onclick="location.href='bilty.html'">➕ New Bilty</button>
    </div>
    <div id="msg" class="msg"></div>
  </div>

  <div class="box">
    <div class="stats">
      <div class="stat"><b id="count">0</b><span>Total LRs</span></div>
      <div class="stat"><b id="packages">0</b><span>Packages</span></div>
      <div class="stat"><b id="weight">0</b><span>Weight</span></div>
      <div class="stat"><b id="freight">₹0</b><span>Freight</span></div>
      <div class="stat"><b id="total">₹0</b><span>Total</span></div>
    </div>
  </div>

  <div class="print-head" id="printHead">
    <div class="print-company">NANDHISHWARA ROAD TRANSPORT</div>
    <div class="print-subtitle">LR REPORT SHEET</div>
    <div class="print-period" id="printPeriod"></div>
  </div>

  <div class="box">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>LR No.</th><th>Date</th><th>From</th><th>To</th>
            <th>Consignor</th><th>Consignee</th><th>Packages</th>
            <th>Weight</th><th>Freight</th><th>LR Charge</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
'use strict';

const sb = window.supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_PUBLISHABLE_KEY,
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}
);

const $ = id => document.getElementById(id);

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

function money(v){
  return '₹' + Number(v || 0).toLocaleString('en-IN',{maximumFractionDigits:2});
}

function setMsg(text,ok){
  $('msg').textContent=text;
  $('msg').className='msg ' + (ok ? 'ok' : 'err');
}

async function logout(){
  try{
    const result = await sb.auth.signOut();
    if(result.error) throw result.error;
    location.href='bilty.html';
  }catch(e){
    setMsg('Logout error: ' + (e.message || e),false);
  }
}

function getFiltered(rows){
  const f=$('fromDate').value;
  const t=$('toDate').value;
  const q=$('allSearch').value.trim().toLowerCase();

  return rows.filter(function(x){
    const values=[
      x.lr_no,x.consignor_name,x.consignee_name,
      x.from_location,x.to_location
    ].map(function(v){return String(v || '').toLowerCase();});

    return (!f || String(x.lr_date || '') >= f) &&
           (!t || String(x.lr_date || '') <= t) &&
           (!q || values.some(function(v){return v.indexOf(q) !== -1;}));
  }).sort(function(a,b){
    return String(b.lr_date || '').localeCompare(String(a.lr_date || '')) ||
           Number(b.id || 0)-Number(a.id || 0);
  });
}

function shareText(x){
  return [
    'NANDHISHWARA ROAD TRANSPORT',
    'LR No: ' + (x.lr_no || ''),
    'Date: ' + (x.lr_date || ''),
    'From: ' + (x.from_location || ''),
    'To: ' + (x.to_location || ''),
    'Consignor: ' + (x.consignor_name || ''),
    'Consignee: ' + (x.consignee_name || ''),
    'Packages: ' + (x.packages || 0),
    'Freight: ' + money(x.freight),
    'LR Charge: ' + money(x.other_charges),
    'Total: ' + money(Number(x.freight||0)+Number(x.hamali||0)+Number(x.other_charges||0))
  ].join('\\n');
}

function shareWhatsApp(i){
  const x=window.reportRows[i];
  window.open('https://wa.me/?text='+encodeURIComponent(shareText(x)),'_blank');
}

function shareEmail(i){
  const x=window.reportRows[i];
  location.href='mailto:?subject='+encodeURIComponent('NRT LR - '+(x.lr_no||''))+
    '&body='+encodeURIComponent(shareText(x));
}

async function shareOther(i){
  const x=window.reportRows[i];
  if(navigator.share){
    try{await navigator.share({title:'NRT LR '+(x.lr_no||''),text:shareText(x)});}
    catch(e){}
  }else{
    shareWhatsApp(i);
  }
}

function toggleShare(i){
  document.querySelectorAll('.share-menu').forEach(function(m){m.style.display='none';});
  const m=$('share-'+i);
  if(m)m.style.display='block';
}

function render(rows,totalRows){
  window.reportRows=rows;

  let packages=0,weight=0,freight=0,charges=0,hamali=0;

  $('rows').innerHTML=rows.map(function(x,i){
    packages += Number(x.packages||0);
    weight += Number(x.weight||0);
    freight += Number(x.freight||0);
    charges += Number(x.other_charges||0);
    hamali += Number(x.hamali||0);

    const id=encodeURIComponent(x.id);

    return '<tr>'+
      '<td><b>'+esc(x.lr_no)+'</b></td>'+
      '<td>'+esc(x.lr_date)+'</td>'+
      '<td>'+esc(x.from_location)+'</td>'+
      '<td>'+esc(x.to_location)+'</td>'+
      '<td>'+esc(x.consignor_name)+'</td>'+
      '<td>'+esc(x.consignee_name)+'</td>'+
      '<td>'+Number(x.packages||0)+'</td>'+
      '<td>'+Number(x.weight||0)+'</td>'+
      '<td class="right">'+money(x.freight)+'</td>'+
      '<td class="right">'+money(x.other_charges)+'</td>'+
      '<td class="act">'+
        '<a class="small blue" href="bilty.html?view='+id+'">View</a>'+
        '<a class="small green" href="bilty.html?edit='+id+'">Edit</a>'+
        '<a class="small yellow" href="bilty.html?print='+id+'">Print</a>'+
        '<button type="button" class="small blue" onclick="toggleShare('+i+')">Share</button>'+
        '<div class="share-menu" id="share-'+i+'">'+
          '<button type="button" onclick="shareWhatsApp('+i+')">📱 WhatsApp</button>'+
          '<button type="button" onclick="shareEmail('+i+')">✉️ Email</button>'+
          '<button type="button" onclick="shareOther('+i+')">📤 Other</button>'+
        '</div>'+
        '<button type="button" class="small red" onclick="deleteLR('+i+')">Delete</button>'+
      '</td>'+
    '</tr>';
  }).join('');

  $('count').textContent=rows.length;
  $('packages').textContent=packages;
  $('weight').textContent=weight;
  $('freight').textContent=money(freight);
  $('total').textContent=money(freight+charges+hamali);

  setMsg(rows.length+' LR records loaded. Database total: '+totalRows+'.',true);
}

async function loadReport(){
  setMsg('Loading LR records...',true);

  try{
    let session=(await sb.auth.getSession()).data.session;

    if(!session){
      const refresh=await sb.auth.refreshSession();
      session=refresh.data.session;
    }

    if(!session){
      setMsg('Login session not found. Please login from NRT Bilty.',false);
      return;
    }

    let all=[];
    const pageSize=500;

    for(let start=0;;start+=pageSize){
      const result=await sb.from('lrs')
        .select('*')
        .range(start,start+pageSize-1);

      if(result.error) throw result.error;

      const batch=result.data || [];
      all=all.concat(batch);

      if(batch.length < pageSize) break;
    }

    render(getFiltered(all),all.length);
  }catch(e){
    console.error(e);
    $('rows').innerHTML='';
    $('count').textContent='0';
    $('packages').textContent='0';
    $('weight').textContent='0';
    $('freight').textContent='₹0';
    $('total').textContent='₹0';
    setMsg('Database error: '+(e.message || String(e)),false);
  }
}

async function deleteLR(i){
  const x=window.reportRows[i];
  if(!x)return;
  if(!confirm('Delete LR '+(x.lr_no || '')+'? This cannot be undone.'))return;

  try{
    const result=await sb.from('lrs').delete().eq('id',x.id);
    if(result.error)throw result.error;
    await loadReport();
  }catch(e){
    setMsg('Delete error: '+(e.message || String(e)),false);
  }
}

function clearFilters(){
  $('fromDate').value='';
  $('toDate').value='';
  $('allSearch').value='';
  loadReport();
}

function updatePrintPeriod(){
  const f=$('fromDate').value;
  const t=$('toDate').value;
  const q=$('allSearch').value.trim();

  let s='Period: '+(f || 'All')+' to '+(t || 'All');
  if(q)s+=' | Search: '+q;
  $('printPeriod').textContent=s;
}

function printReport(){
  updatePrintPeriod();
  window.print();
}

function printPDF(){
  updatePrintPeriod();
  window.print();
}

function exportExcel(){
  const rows=window.reportRows||[];
  if(!rows.length){alert("No LR records to export.");return;}
  const f=$('fromDate').value, t=$('toDate').value, q=$('allSearch').value.trim();
  const escX=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const moneyX=v=>Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});
  let html='<html><head><meta charset="UTF-8"><style>table{border-collapse:collapse}th,td{border:1px solid #777;padding:6px;font-family:Arial;font-size:10pt}th{background:#d9eaf7;font-weight:bold}.title{text-align:center;font-size:16pt;font-weight:bold}.sub{text-align:center;font-size:12pt;font-weight:bold}</style></head><body>';
  html+='<div class="title">NANDHISHWARA ROAD TRANSPORT</div><div class="sub">LR REPORT SHEET</div>';
  html+='<p>Period: '+escX(f||'All')+' to '+escX(t||'All')+(q?' | Search: '+escX(q):'')+'</p>';
  html+='<table><tr><th>LR No.</th><th>Date</th><th>From</th><th>To</th><th>Consignor</th><th>Consignee</th><th>Packages</th><th>Weight</th><th>Freight</th><th>LR Charge</th><th>Hamali</th><th>Total</th></tr>';
  rows.forEach(x=>{const total=Number(x.freight||0)+Number(x.hamali||0)+Number(x.other_charges||0);html+='<tr>'+'<td>'+escX(x.lr_no)+'</td>'+'<td>'+escX(x.lr_date)+'</td>'+'<td>'+escX(x.from_location)+'</td>'+'<td>'+escX(x.to_location)+'</td>'+'<td>'+escX(x.consignor_name)+'</td>'+'<td>'+escX(x.consignee_name)+'</td>'+'<td>'+Number(x.packages||0)+'</td>'+'<td>'+Number(x.weight||0)+'</td>'+'<td>'+moneyX(x.freight)+'</td>'+'<td>'+moneyX(x.other_charges)+'</td>'+'<td>'+moneyX(x.hamali)+'</td>'+'<td>'+moneyX(total)+'</td>'+'</tr>';});
  html+='</table></body></html>';
  const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='NRT_LR_Report_'+new Date().toISOString().slice(0,10)+'.xls';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}


$('allSearch').addEventListener('keydown',function(e){
  if(e.key==='Enter')loadReport();
});

document.addEventListener('click',function(e){
  if(!e.target.closest('.act')){
    document.querySelectorAll('.share-menu').forEach(function(m){m.style.display='none';});
  }
});

window.addEventListener('beforeprint',updatePrintPeriod);

window.addEventListener('load',function(){
  loadReport();
});
</script>
</body>
</html>
