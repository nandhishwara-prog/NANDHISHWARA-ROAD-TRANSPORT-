.top{background:linear-gradient(110deg,rgba(5,48,119,.97),rgba(12,77,150,.94));color:#fff;padding:12px 14px;box-shadow:0 3px 14px rgba(5,35,75,.2)}
.topin{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top a{color:#fff;text-decoration:none;white-space:nowrap;font-weight:700}
.brandlockup{display:flex;align-items:center;gap:10px;min-width:0}
.nrt-logo{width:49px;height:49px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.brandtext{min-width:0}
.brandtext b{display:block;font-size:18px;line-height:1.15;letter-spacing:.35px}
.brandtext span{display:block;font-size:10px;letter-spacing:1.4px;font-weight:800;color:#ffdf55;margin-top:4px}
.wrap{max-width:1150px;margin:auto;padding:18px}
.box{background:rgba(255,255,255,.85);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border:1px solid rgba(210,222,238,.95);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 6px 20px rgba(28,52,86,.07)}
.title{color:#1257a6}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.full{grid-column:1/-1}
label{font-size:12px;font-weight:800;display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd4df;border-radius:7px;font-size:14px}
textarea{min-height:55px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:7px;padding:10px 15px;font-weight:800;cursor:pointer}
.blue{background:#1257a6;color:#fff}.yellow{background:#ffd21c;color:#15396b}
.gray{background:#6b7280;color:#fff}.red{background:#c62828;color:#fff}
.msg{margin-top:8px;font-weight:700}
.search{display:flex;gap:8px}.search input{flex:1}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px;border-bottom:1px solid #e2e7ee;text-align:left;white-space:nowrap}
.badge{padding:4px 7px;border-radius:10px;background:#eaf3ff;color:#1257a6;font-weight:800}
.printarea{display:none}

@media(max-width:750px){
.grid{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}.wrap{padding:10px}
.top{padding:10px}
.nrt-logo{width:42px;height:42px}
.brandtext b{font-size:15px}
.brandtext span{font-size:8px;letter-spacing:1px}
}
@media(max-width:480px){
.grid{grid-template-columns:1fr}
.topin{gap:7px}
.brandlockup{gap:7px}
.nrt-logo{width:36px;height:36px}
.brandtext b{font-size:12px;letter-spacing:0}
.brandtext span{font-size:7px;letter-spacing:.75px;margin-top:3px}
.top a{font-size:11px}
.wrap{padding:8px}
.box{padding:13px}
}


@media print{
@page{size:A4 portrait;margin:0}
html,body{background:#fff!important;background-image:none!important}
.top,.wrap>*:not(#printArea){display:none!important}
.wrap{margin:0!important;padding:0!important}
.printarea{display:block!important;width:210mm;height:297mm;overflow:hidden;background:#fff}
.sheet{width:210mm;height:297mm;padding:1.5mm;display:flex;flex-direction:column;gap:.35mm;background:#fff}
.copy{height:97.9mm;min-height:97.9mm;border:1.2px solid #111;overflow:hidden;background:#fff!important;color:#111;font-size:7.5px;flex:none}
.copyhead{height:25mm;display:grid;grid-template-columns:1fr 67mm;border-bottom:1.2px solid #111}
.brand{padding:2.5mm 3mm}
.company{font-size:18px;font-weight:900;line-height:1.05;letter-spacing:.2px}
.address{font-size:10.5px;font-weight:800;margin-top:1.5mm;line-height:1.2}
.phone{font-size:11px;font-weight:900;margin-top:1.2mm}
.service{font-size:8px;font-weight:900;margin-top:1mm;letter-spacing:.3px}
.side{border-left:1.2px solid #111}
.sidetop{height:8mm;display:grid;grid-template-columns:1fr 30mm;border-bottom:1px solid #111}
.gstbox{padding:2mm;font-size:7.5px;font-weight:900}
.copyname{display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;border-left:1px solid #111}
.lrbox{height:17mm;display:grid;grid-template-columns:1fr 1fr}
.lrbox div{display:flex;align-items:center;padding:2mm;font-size:7.8px;font-weight:900}
.lrbox div+div{border-left:1px solid #111}
.lrno-big{font-size:10px;font-weight:900;margin-left:1mm}
.date-big{font-size:9px;font-weight:900;margin-left:1mm}

.meta{height:9mm;display:grid;grid-template-columns:1fr 1.35fr 1.15fr;border-bottom:1.2px solid #111}
.meta div{padding:1.8mm 2.2mm;display:flex;align-items:center;font-size:8.5px;font-weight:900;border-right:1px solid #111}
.meta div:last-child{border-right:0}
.route-big,.freight-type-big{font-size:10.5px;font-weight:900;margin-left:1mm}

.info{height:23mm;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:13.2mm 9.8mm;border-bottom:1.2px solid #111}
.col+.col{border-left:1px solid #111}
.cell{padding:1.8mm 2.5mm;border-bottom:1px solid #111;line-height:1.15;min-height:9.8mm}
.cell:last-child{border-bottom:0}
.party{font-weight:900;font-size:11.5px}
.phone-big{font-size:10.5px;font-weight:900}
.invoice-big,.invoice-value-big{font-size:10px;font-weight:900}
.invoice-combined{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #111}
.invoice-combined>div{padding:1.7mm 2.5mm;display:flex;align-items:center;font-weight:900}
.invoice-combined>div+div{border-left:1px solid #111}

.body{height:18.2mm;display:grid;grid-template-columns:1fr 47mm;border-bottom:1.2px solid #111}
.goodshead,.goodsrow{display:grid;grid-template-columns:1fr 16mm 1fr}
.goodshead{height:5mm;font-weight:900;font-size:7.5px;border-bottom:1px solid #111}
.goodsrow{height:12mm}
.goodshead div,.goodsrow div{padding:1.2mm 1.5mm;display:flex;align-items:center;border-right:1px solid #111}
.goodshead div{justify-content:center}
.goodsrow div:nth-child(1),.goodsrow div:nth-child(3){justify-content:flex-start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px;font-weight:900}
.goodsrow div:nth-child(2){justify-content:center;font-size:9px;font-weight:900}
.charges{border-left:1px solid #111;display:grid;grid-template-columns:1fr 18mm;grid-template-rows:repeat(4,1fr)}
.charge{display:contents}
.charge div{padding:1.1mm 1.4mm;border-bottom:1px solid #111;font-weight:800}
.charge div:first-child{border-right:1px solid #111}
.charges .charge:last-child div{border-bottom:0}
.total,.total-amount{font-weight:900!important}
.total-amount{font-size:11px!important}

.footer{height:20.5mm;display:block}
.remark{padding:2mm 2.2mm;font-size:7px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
}

</style>
</head>

<div><label>Consignee Name</label><input id="consignee_name" list="partyNames"></div>
<div><label>Consignee Phone</label><input id="consignee_phone"></div>

<div><label>Quantity</label><input id="packages" type="number" min="0" step="1" value="0" placeholder="Enter quantity"></div>
<div><label>Weight</label><input id="weight" type="number" min="0" value="0"></div>

<div class="full"><label>Goods / Description</label><input id="goods"></div>

<div><label>Invoice Number</label><input id="invoice_no"></div>
<div><label>Invoice Value</label><input id="invoice_value" type="number" min="0" value="0"></div>
<div><label>Freight</label><input id="freight" type="number" min="0" value="0"></div>
<div><label>Hamali Charge</label><input id="hamali" type="number" min="0" value="0"></div>
<div><label>LR CHARGE</label><input id="other_charges" type="number" min="0" value="0"></div>

<div class="full"><label>Remarks</label><textarea id="remarks"></textarea></div>
</div>

<div class="actions">
<button class="blue" onclick="saveLR()">💾 Save Bilty</button>
<button class="yellow" onclick="printLR()">🖨️ Print / PDF</button>
<button class="gray" onclick="clearForm()">Clear</button>
<button class="green" onclick="location.href='reports.html'">📊 Reports</button>
<button class="red" onclick="logout()">Logout</button>
</div>
<div id="msg" class="msg"></div>
</div>
</div>
</div>

<datalist id="partyNames"></datalist>
<div id="printArea" class="printarea"></div>

<script>
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),editingId=null;

const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);

function msg(t){$('msg').textContent=t}

function esc(x){
return String(x??'').replace(/[&<>"]/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;'
}[m]))
}

function money(x){
return '₹'+Number(x||0).toLocaleString('en-IN')
}

async function login(){
let{error}=await sb.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});
if(error){$('loginMsg').textContent=error.message;return}
showApp()
}

async function logout(){
await sb.auth.signOut();
location.reload()
}

async function nextLR(){
let{data,error}=await sb.from('lrs').select('lr_no').like('lr_no','NRT/%').limit(1000);
if(error)throw error;
let max=0;
(data||[]).forEach(x=>{
let m=String(x.lr_no||'').match(/^NRT\/(\d+)$/);
if(m)max=Math.max(max,+m[1])
});
return 'NRT/'+(max?max+1:45243)
}

async function showApp(){
$('loginBox').style.display='none';
$('app').style.display='block';
$('lr_date').value=today();
$('from_location').value='HYDERABAD';
$('lr_no').value=await nextLR();
loadParties()
}

async function loadParties(){
  let{data,error}=await sb.from('lrs')
    .select('consignor_name,consignor_phone,consignee_name,consignee_phone')
    .limit(5000);

  if(error)return;

  const parties={};

  (data||[]).forEach(r=>{
    const cn=String(r.consignor_name||'').trim();
    const cp=String(r.consignor_phone||'').trim();
    const en=String(r.consignee_name||'').trim();
    const ep=String(r.consignee_phone||'').trim();

    if(cn)parties[cn]=cp;
    if(en)parties[en]=ep;
  });

  // Keep one combined customer/party list for both Consignor and Consignee.
  $('partyNames').innerHTML=Object.keys(parties)
    .sort((a,b)=>a.localeCompare(b))
    .map(n=>`<option value="${esc(n)}">`)
    .join('');

  function autoPhone(nameId,phoneId){
    const name=$(nameId).value.trim();
    if(!name)return;

    // Exact match first.
    if(parties[name]!==undefined){
      $(phoneId).value=parties[name]||'';
      return;
    }

    // Case-insensitive match as a fallback.
    const key=Object.keys(parties).find(n=>n.toLowerCase()===name.toLowerCase());
    if(key)$(phoneId).value=parties[key]||'';
  }

  // Selecting/typing a previously used name automatically fills its phone.
  ['input','change'].forEach(ev=>{
    $('consignor_name').addEventListener(ev,()=>autoPhone('consignor_name','consignor_phone'));
    $('consignee_name').addEventListener(ev,()=>autoPhone('consignee_name','consignee_phone'));
  });

  // Also save the phone in the local browser for instant suggestions/autofill
  // even before a new record has been reloaded from the database.
  function rememberParty(nameId,phoneId){
    const name=$(nameId).value.trim();
    const phone=$(phoneId).value.trim();
    if(!name)return;

    let saved={};
    try{saved=JSON.parse(localStorage.getItem('nrt_parties')||'{}')}catch(e){}
    saved[name]=phone;
    localStorage.setItem('nrt_parties',JSON.stringify(saved));
  }

  function autoLocal(nameId,phoneId){
    const name=$(nameId).value.trim();
    if(!name)return;
    let saved={};
    try{saved=JSON.parse(localStorage.getItem('nrt_parties')||'{}')}catch(e){}
    if(saved[name] && !$(phoneId).value.trim())$(phoneId).value=saved[name];
  }

  ['input','change'].forEach(ev=>{
    $('consignor_name').addEventListener(ev,()=>autoLocal('consignor_name','consignor_phone'));
    $('consignee_name').addEventListener(ev,()=>autoLocal('consignee_name','consignee_phone'));
  });

  $('consignor_phone').addEventListener('change',()=>rememberParty('consignor_name','consignor_phone'));
  $('consignee_phone').addEventListener('change',()=>rememberParty('consignee_name','consignee_phone'));

  // Load locally remembered parties into the datalist too.
  let local={};
  try{local=JSON.parse(localStorage.getItem('nrt_parties')||'{}')}catch(e){}
  Object.keys(local).forEach(n=>{
    if(!parties[n])parties[n]=local[n];
  });

  $('partyNames').innerHTML=Object.keys(parties)
    .sort((a,b)=>a.localeCompare(b))
    .map(n=>`<option value="${esc(n)}">`)
    .join('');
}

function row(){
return{
lr_no:$('lr_no').value,
lr_date:$('lr_date').value,
from_location:$('from_location').value,
to_location:$('to_location').value,
freight_type:$('freight_type').value,
consignor_name:$('consignor_name').value,
consignor_phone:$('consignor_phone').value,
consignee_name:$('consignee_name').value,
consignee_phone:$('consignee_phone').value,
packages:+$('packages').value||0,
weight:+$('weight').value||0,
goods:$('goods').value,
invoice_no:$('invoice_no').value,
invoice_value:+$('invoice_value').value||0,
freight:+$('freight').value||0,
hamali:+$('hamali').value||0,
other_charges:+$('other_charges').value||0,
remarks:$('remarks').value,
status:'Booked'
}
}

async function saveLR(){
let r=row();
let q=editingId?
sb.from('lrs').update(r).eq('id',editingId):
sb.from('lrs').insert(r);

let{error}=await q;
if(error){msg(error.message);return}

msg(`${r.lr_no} saved successfully.`);
editingId=null;
printLR();

setTimeout(async()=>{
$('lr_no').value=await nextLR()
},300)
}

function clearForm(){
editingId=null;
$('lr_date').value=today();
$('from_location').value='HYDERABAD';

['to_location','consignor_name','consignor_phone',
'consignee_name','consignee_phone','goods','invoice_no','remarks']
.forEach(id=>$(id).value='');

['packages','weight','invoice_value','freight','hamali','other_charges']
.forEach(id=>$(id).value=0);

nextLR().then(x=>$('lr_no').value=x)
}

async function loadLR(id){
const {data,error}=await sb.from('lrs').select('*').eq('id',id).single();
if(error){alert('LR data load failed: '+error.message);return null}
if(!data){alert('LR record not found');return null}
return data
}

function fillForm(r){
const f={lr_no:r.lr_no||'',lr_date:r.lr_date||'',freight_type:r.freight_type||'TO PAY',from_location:r.from_location||'',to_location:r.to_location||'',consignor_name:r.consignor_name||'',consignor_phone:r.consignor_phone||'',consignee_name:r.consignee_name||'',consignee_phone:r.consignee_phone||'',packages:r.packages||0,weight:r.weight||0,goods:r.goods||'',invoice_no:r.invoice_no||'',invoice_value:r.invoice_value||0,freight:r.freight||0,hamali:r.hamali||0,other_charges:r.other_charges||0,remarks:r.remarks||''};
Object.keys(f).forEach(k=>{if($(k))$(k).value=f[k]})
}

function setFormReadOnly(on){
document.querySelectorAll('#app input,#app select,#app textarea').forEach(e=>e.disabled=on);
document.querySelectorAll('#app .actions button').forEach(b=>b.style.display=on?'none':'');
}

async function openRequestedLR(mode,id){
const r=await loadLR(id);
if(!r)return;
$('loginBox').style.display='none';
$('app').style.display='block';
fillForm(r);
editingId=r.id;
setFormReadOnly(mode==='view');
}

function formatPrintDate(v){
  if(!v)return '';
  const a=String(v).split('-');
  if(a.length===3 && a[0].length===4) return a[2]+'/'+a[1]+'/'+a[0];
  return v;
}

async function printLR(){

const params=new URLSearchParams(window.location.search);
const printId=params.get('print');

let r;

if(printId){

r=await loadLR(printId);
if(!r)return;

}else{

r=row();

}

let total=Number(r.freight||0)+Number(r.hamali||0)+Number(r.other_charges||0);
let copies=['CONSIGNOR COPY','CONSIGNEE COPY','TRANSPORT COPY'];

$('printArea').innerHTML='<div class="sheet">'+copies.map(c=>`

<div class="copy">

<div class="copyhead">
<div class="brand">
<div class="company">NANDHISHWARA ROAD TRANSPORT</div>
<div class="address">Plot No. 1, Block No. 3, Autonagar, Hyderabad, Telangana - 500070</div>
<div class="phone">Mobile : 9885410410 / 9989581732</div>
<div class="service">ONE DAY DELIVERY SERVICE</div>
</div>

<div class="side">
<div class="sidetop">
<div class="gstbox">GST No : 36HSYPK0996J1ZM</div>

</div>

<div class="lrbox">

</div>
</div>

</div>

<b>CONSIGNOR :</b> <span class="party">${esc(r.consignor_name)}</span><br>

</div>
</div>

<div class="col">

<b>CONSIGNEE :</b> <span class="party">${esc(r.consignee_name)}</span><br>
<b>Mobile :</b> <span class="party phone-big">${esc(r.consignee_phone)}</span>

<div class="body">

<div>DESCRIPTION</div>

<div>${money(r.hamali)}</div>
</div>

<div>LR Charge</div>
<div>${money(r.other_charges)}</div>
</div>

<div class="charge">

<div class="total total-amount">${money(total)}</div>
</div>

</div>
</div>

<div class="footer">
<div class="remark">
<b>Remarks :</b> ${esc(r.remarks)} &nbsp;&nbsp; <b>GST Paid By :</b> Not Applicable &nbsp;&nbsp; Goods booked at owner's risk and said to contain basis. Non Negotiable
</div>
</div>

</div>

`).join('')+'</div>';

}

window.addEventListener('load',async()=>{

let{data:{session}}=await sb.auth.getSession();

if(!session)return;

const params=new URLSearchParams(window.location.search);
const printId=params.get('print');
const viewId=params.get('view');
const editId=params.get('edit');

if(printId){

$('loginBox').style.display='none';
$('app').style.display='none';
await printLR();

}else if(viewId){

await openRequestedLR('view',viewId);

}else if(editId){

await openRequestedLR('edit',editId);

}else{

showApp();

}

});
</script>
</body>
</html>
