<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NRT Online Bilty</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#111827}
.top{background:#073b8f;color:#fff;padding:12px 16px}
.topin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top b{font-size:20px}
.nav{display:flex;gap:7px;flex-wrap:wrap}
.nav a,.nav button{background:#fff;color:#073b8f;padding:8px 12px;border-radius:6px;font-weight:bold;text-decoration:none;border:0;cursor:pointer}
.wrap{max-width:1100px;margin:16px auto;padding:0 12px}
.box{background:#fff;border:1px solid #d5dbe3;border-radius:9px;padding:15px;margin-bottom:14px;box-shadow:0 2px 7px #00000012}
.title{margin:0 0 13px;color:#073b8f}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}
input,select,textarea{width:100%;padding:9px;border:1px solid #b9c2ce;border-radius:6px;background:#fff;font:inherit}
textarea{min-height:70px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:6px;padding:10px 16px;font-weight:bold;cursor:pointer}
.blue{background:#073b8f;color:#fff}.yellow{background:#ffd21f;color:#111}.gray{background:#6b7280;color:#fff}.green{background:#16803c;color:#fff}.red{background:#b91c1c;color:#fff}
.msg{margin-top:8px;color:#b91c1c;font-weight:bold;min-height:18px}
.success{color:#16803c!important}
#loginBox{max-width:650px;margin:35px auto}
#app{display:none}
.readonly{background:#eef2f7}
.required{color:#b91c1c}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.grid{grid-template-columns:1fr}.topin{align-items:flex-start;flex-direction:column}}
@media print{
 body{background:#fff}
 .top,#loginBox,#formBox,.no-print{display:none!important}
 #app{display:block!important}
 .print-area{display:block!important}
 .wrap{max-width:none;margin:0;padding:0}
}
.print-area{display:none}
.copy{height:92mm;border:1.2px solid #111;margin:0 0 3mm;padding:3mm;position:relative;page-break-inside:avoid}
.copy:last-child{margin-bottom:0}
.copy-head{display:grid;grid-template-columns:1fr 38mm;gap:2mm;border-bottom:1px solid #111;padding-bottom:2mm}
.company{font-weight:bold;font-size:14px;line-height:1.2}
.address{font-size:10px;line-height:1.25}
.phones{border:1px solid #111;padding:2mm;font-size:10px;font-weight:bold}
.service{text-align:center;font-weight:bold;font-size:11px;margin:1.5mm 0}
.meta{display:grid;grid-template-columns:1fr 1fr 38mm;gap:2mm;margin-bottom:2mm}
.meta div{border:1px solid #111;padding:1.5mm;font-size:10px}
.meta b{font-size:11px}
.copy-title{text-align:center;font-weight:bold;font-size:11px;border:1px solid #111;padding:1mm}
.people{display:grid;grid-template-columns:1fr 1fr;gap:2mm;margin-bottom:2mm}
.person{border:1px solid #111;padding:1.5mm;min-height:13mm;font-size:9px}
.person strong{font-size:12px}
.goods{border:1px solid #111}
.goods-row{display:grid;grid-template-columns:22mm 30mm 1fr}
.goods-row>div{border-right:1px solid #111;padding:1.5mm;font-size:9px;min-height:9mm}
.goods-row>div:last-child{border-right:0}
.sign{position:absolute;right:3mm;bottom:3mm;width:38mm;height:13mm;border:1px solid #111;font-size:8px;padding:1mm}
.gst{font-size:11px;font-weight:bold}
.inv{font-size:10px}
@page{size:A4 portrait;margin:6mm}
</style>
</head>
<body>
<div class="top no-print"><div class="topin">
<b>NANDHISHWARA ROAD TRANSPORT</b>
<div class="nav">
<a href="index.html">Home</a>
<a href="reports.html">Reports</a>
<button type="button" onclick="logout()">Logout</button>
</div>
</div></div>

<div class="wrap">
<div class="box" id="loginBox">
<h2 class="title">NRT Staff Login</h2>
<div class="grid">
<div><label>Email</label><input id="email" type="email" placeholder="NRT account email"></div>
<div><label>Password</label><input id="password" type="password" placeholder="Password"></div>
</div>
<div class="actions"><button type="button" class="blue" id="loginBtn">Login</button></div>
<div id="loginMsg" class="msg"></div>
</div>

<div id="app">
<div class="box" id="formBox">
<h2 class="title" id="formTitle">➕ New Bilty / LR</h2>
<form id="lrForm">
<div class="grid">
<div><label>LR Number</label><input id="lr_no" class="readonly" readonly></div>
<div><label>Date</label><input id="lr_date" type="date"></div>
<div><label>Vehicle No.</label><input id="vehicle_no"></div>
<div><label>Freight Type</label><select id="freight_type"><option>TO PAY</option><option>PAID</option><option>ON ACCOUNT</option></select></div>

<div><label>From</label><input id="from_location"></div>
<div><label>To</label><input id="to_location"></div>
<div><label>Consignor Name</label><input id="consignor_name"></div>
<div><label>Consignor Phone</label><input id="consignor_phone"></div>

<div><label>Consignee Name</label><input id="consignee_name"></div>
<div><label>Consignee Phone</label><input id="consignee_phone"></div>
<div><label>Packages / Qty</label><input id="packages" type="number" min="0" value="0"></div>
<div><label>Weight</label><input id="weight" type="number" min="0" step="0.01" value="0"></div>

<div><label>Invoice Number</label><input id="invoice_no"></div>
<div><label>Invoice Value</label><input id="invoice_value" type="number" min="0" step="0.01" value="0"></div>
<div><label>Freight</label><input id="freight" type="number" min="0" step="0.01" value="0"></div>
<div><label>LR CHARGE</label><input id="other_charges" type="number" min="0" step="0.01" value="0"></div>

<div style="grid-column:1/-1"><label>Goods / Description</label><textarea id="goods"></textarea></div>
<div style="grid-column:1/-1"><label>Remarks</label><textarea id="remarks"></textarea></div>
<div><label>Status</label><select id="status"><option>Booked</option><option>In Transit</option><option>Delivered</option><option>Cancelled</option></select></div>
</div>
<div class="actions">
<button type="button" class="green" id="saveBtn">Save Bilty</button>
<button type="button" class="yellow" id="printBtn">Print / PDF</button>
<button type="button" class="gray" id="clearBtn">Clear</button>
<button type="button" class="blue" onclick="location.href='reports.html'">Reports</button>
</div>
<div id="msg" class="msg"></div>
</form>
</div>
</div>

<div class="print-area" id="printArea"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
'use strict';
var sb=null, currentId=null, currentRecord=null;
function $(id){return document.getElementById(id);}
function msg(s,ok){$('msg').className='msg'+(ok?' success':'');$('msg').innerHTML=s||'';}
function loginMsg(s){$('loginMsg').textContent=s||'';}
function today(){var d=new Date(),m=('0'+(d.getMonth()+1)).slice(-2),day=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+day;}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});}

function init(){
 try{
  if(!window.supabase || typeof SUPABASE_URL==='undefined' || typeof SUPABASE_PUBLISHABLE_KEY==='undefined'){
   loginMsg('Supabase library/config did not load. Please refresh.');
   return;
  }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  $('loginBtn').onclick=login;
  $('saveBtn').onclick=saveLR;
  $('printBtn').onclick=function(){printCurrent();};
  $('clearBtn').onclick=clearForm;
  $('lr_date').value=today();
  sb.auth.getSession().then(function(r){if(r.data&&r.data.session){showApp();}else{showLogin();}});
 }catch(e){loginMsg(e.message||String(e));}
}
function showLogin(){$('loginBox').style.display='block';$('app').style.display='none';}
function showApp(){$('loginBox').style.display='none';$('app').style.display='block';loadFromUrl();}
function login(){
 loginMsg('Logging in...');
 var em=$('email').value.trim(),pw=$('password').value;
 if(!em||!pw){loginMsg('Email and Password enter cheyyandi.');return;}
 sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
  if(r.error){loginMsg(r.error.message);return;}
  loginMsg('');showApp();
 }).catch(function(e){loginMsg(e.message||String(e));});
}
function logout(){if(sb)sb.auth.signOut().then(function(){location.href='bilty.html';});}

function setVal(id,v){$(id).value=v==null?'':v;}
function getVal(id){return $(id).value;}
function clearForm(){
 currentId=null;currentRecord=null;
 $('formTitle').textContent='➕ New Bilty / LR';
 $('lr_date').value=today();
 $('freight_type').value='TO PAY';
 ['vehicle_no','from_location','to_location','consignor_name','consignor_phone','consignee_name','consignee_phone','invoice_no','goods','remarks'].forEach(function(id){setVal(id,'');});
 ['packages','weight','invoice_value','freight','other_charges'].forEach(function(id){setVal(id,'0');});
 $('status').value='Booked';
 $('msg').textContent='';
 getNextLR();
}
function getNextLR(){
 sb.from('lrs').select('lr_no').like('lr_no','NRT/%').then(function(r){
  if(r.error){setVal('lr_no','NRT/45243');return;}
  var max=45242,rows=r.data||[];
  rows.forEach(function(x){var n=parseInt(String(x.lr_no||'').replace(/^NRT\//,''),10);if(!isNaN(n)&&n>max)max=n;});
  setVal('lr_no','NRT/'+(max+1));
 });
}
function loadFromUrl(){
 var q=new URLSearchParams(location.search),id=q.get('edit')||q.get('view')||q.get('print');
 if(id){loadLR(id,q.get('edit'),q.get('print'));}else{clearForm();}
}
function loadLR(id,isEdit,isPrint){
 sb.from('lrs').select('*').eq('id',id).single().then(function(r){
  if(r.error){msg(r.error.message,false);return;}
  currentId=r.data.id;currentRecord=r.data;fill(r.data);
  if(isEdit){$('formTitle').textContent='✏️ Edit Bilty / LR';}
  if(isPrint){printCurrent();}
 });
}
function fill(x){
 setVal('lr_no',x.lr_no);setVal('lr_date',x.lr_date);setVal('vehicle_no',x.vehicle_no);
 setVal('freight_type',x.freight_type||'TO PAY');setVal('from_location',x.from_location);setVal('to_location',x.to_location);
 setVal('consignor_name',x.consignor_name);setVal('consignor_phone',x.consignor_phone);
 setVal('consignee_name',x.consignee_name);setVal('consignee_phone',x.consignee_phone);
 setVal('packages',x.packages||0);setVal('weight',x.weight||0);setVal('invoice_no',x.invoice_no||'');
 setVal('invoice_value',x.invoice_value||0);setVal('goods',x.goods);setVal('freight',x.freight||0);
 setVal('other_charges',x.other_charges||0);setVal('remarks',x.remarks);setVal('status',x.status||'Booked');
}
function payload(){
 return {
  lr_no:getVal('lr_no'),lr_date:getVal('lr_date')||today(),vehicle_no:getVal('vehicle_no'),
  from_location:getVal('from_location'),to_location:getVal('to_location'),
  delivery_type:null,consignor_name:getVal('consignor_name'),consignor_phone:getVal('consignor_phone'),
  consignee_name:getVal('consignee_name'),consignee_phone:getVal('consignee_phone'),
  packages:Number(getVal('packages')||0),weight:Number(getVal('weight')||0),goods:getVal('goods'),
  freight:Number(getVal('freight')||0),other_charges:Number(getVal('other_charges')||0),
  remarks:getVal('remarks'),status:getVal('status')||'Booked',freight_type:getVal('freight_type')||'TO PAY',
  invoice_no:getVal('invoice_no'),invoice_value:Number(getVal('invoice_value')||0)
 };
}
function saveLR(){
 msg('Saving...',true);
 var p=payload(),promise;
 if(!p.lr_no){msg('LR Number missing.',false);return;}
 if(currentId){promise=sb.from('lrs').update(p).eq('id',currentId).select().single();}
 else{promise=sb.from('lrs').insert(p).select().single();}
 promise.then(function(r){
  if(r.error){msg(r.error.message,false);return;}
  currentId=r.data.id;currentRecord=r.data;
  $('formTitle').textContent='✏️ Edit Bilty / LR';
  msg('Bilty saved successfully. LR: '+esc(r.data.lr_no),true);
 }).catch(function(e){msg(e.message||String(e),false);});
}
function makeCopy(x,title){
 return '<div class="copy">'+
 '<div class="copy-head"><div><div class="company">NANDHISHWARA ROAD TRANSPORT</div><div class="address">Corporate Office: Autonagar, Hyderabad, Telangana - 500070</div><div class="gst">GSTIN: 36HSYPK0996J1ZM</div></div><div class="phones">9885410410<br>9989581732</div></div>'+
 '<div class="service">ONE DAY DELIVERY SERVICE</div>'+
 '<div class="meta"><div><b>LR No:</b> '+esc(x.lr_no)+'</div><div><b>Date:</b> '+esc(x.lr_date)+'</div><div class="copy-title">'+title+'</div></div>'+
 '<div class="people"><div class="person"><b>Consignor</b><br><strong>'+esc(x.consignor_name)+'</strong><br>'+esc(x.consignor_phone)+'</div><div class="person"><b>Consignee</b><br><strong>'+esc(x.consignee_name)+'</strong><br>'+esc(x.consignee_phone)+'</div></div>'+
 '<div class="people"><div class="person"><b>From:</b> '+esc(x.from_location)+'<br><b>To:</b> '+esc(x.to_location)+'<br><b>Vehicle:</b> '+esc(x.vehicle_no)+'</div><div class="person"><b>Invoice No:</b> <span class="inv">'+esc(x.invoice_no)+'</span><br><b>Invoice Value:</b> '+money(x.invoice_value)+'<br><b>Freight:</b> '+money(x.freight)+' &nbsp; <b>LR CHARGE:</b> '+money(x.other_charges)+'</div></div>'+
 '<div class="goods"><div class="goods-row"><div><b>Qty</b><br><strong>'+esc(x.packages||0)+'</strong></div><div><b>Weight</b><br><strong>'+esc(x.weight||0)+'</strong></div><div><b>Description</b><br>'+esc(x.goods)+'</div></div></div>'+
 '<div style="font-size:9px;margin-top:2mm"><b>Freight Type:</b> '+esc(x.freight_type||'TO PAY')+' &nbsp; <b>Status:</b> '+esc(x.status||'Booked')+'</div>'+
 '<div class="sign">Receiver’s Sign</div>'+
 '</div>';
}
function printCurrent(){
 if(!currentRecord){currentRecord=payload();currentRecord.lr_no=currentRecord.lr_no||'NRT/45243';}
 $('printArea').innerHTML=makeCopy(currentRecord,'CONSIGNOR COPY')+makeCopy(currentRecord,'CONSIGNEE COPY')+makeCopy(currentRecord,'TRANSPORT COPY');
 window.print();
}
window.addEventListener('load',init);
})();
</script>
</body>
</html>
