<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NRT Online Bilty / LR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033}
.top{background:#0c4d96;color:#fff;padding:14px}
.topin{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.top a{color:#fff;text-decoration:none}
.wrap{max-width:1150px;margin:auto;padding:18px}
.box{background:#fff;border:1px solid #dfe5ed;border-radius:12px;padding:18px;margin-bottom:16px}
.title{color:#1257a6}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.full{grid-column:1/-1}
label{font-size:12px;font-weight:800;display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd4df;border-radius:7px;font-size:14px}
textarea{min-height:55px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:7px;padding:10px 15px;font-weight:800;cursor:pointer}
.blue{background:#1257a6;color:#fff}.yellow{background:#ffd21c;color:#15396b}
.gray{background:#6b7280;color:#fff}.red{background:#c62828;color:#fff}
.msg{margin-top:8px;font-weight:700}
.search{display:flex;gap:8px}.search input{flex:1}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px;border-bottom:1px solid #e2e7ee;text-align:left;white-space:nowrap}
.badge{padding:4px 7px;border-radius:10px;background:#eaf3ff;color:#1257a6;font-weight:800}
.printarea{display:none}

@media(max-width:750px){
.grid{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}.wrap{padding:10px}
}
@media(max-width:480px){.grid{grid-template-columns:1fr}}

@media print{
@page{size:A4 portrait;margin:0}
html,body{background:#fff!important}
.top,.wrap>*:not(#printArea){display:none!important}
.wrap{margin:0;padding:0}
.printarea{display:block!important;width:210mm;height:297mm;overflow:hidden;background:#fff}
.sheet{width:210mm;height:297mm;padding:3mm;display:flex;flex-direction:column;gap:1.15mm;background:#fff}
.copy{height:96.1mm;border:1.25px solid #111;padding:0;overflow:hidden;font-size:6.8px;background:#fff!important;color:#111}
.copyhead{height:27.5mm;display:grid;grid-template-columns:1fr 78mm;border-bottom:1.1px solid #111}
.brand{padding:2mm 2.4mm}
.company{font-size:15px;font-weight:900;line-height:1.05}
.address{font-size:9px;font-weight:800;margin-top:1.1mm;line-height:1.15}
.phone{font-size:8px;font-weight:900;margin-top:1mm}
.service{font-size:8px;font-weight:900;margin-top:.8mm}
.side{border-left:1.1px solid #111}
.sidetop{height:9.3mm;display:grid;grid-template-columns:1fr 31mm;border-bottom:1px solid #111}
.gstbox{padding:2.1mm;font-size:8px;font-weight:900}
.copyname{
background:#fff!important;
color:#111!important;
display:flex;
align-items:center;
justify-content:center;
font-size:8.5px;
font-weight:900;
border-left:1px solid #111;
}
.lrbox{height:18.2mm;display:grid;grid-template-columns:1fr 1fr;font-weight:900}
.lrbox div{display:flex;align-items:center;padding:2mm;font-size:8px}
.lrbox div+div{border-left:1px solid #111}
.lrno-big{font-size:11px;font-weight:900;margin-left:1mm}
.date-big{font-size:9px;font-weight:900;margin-left:1mm}

.meta{height:9.5mm;display:grid;grid-template-columns:1fr 1.45fr 1.42fr;border-bottom:1.2px solid #111}
.meta div{padding:1.8mm 2mm;display:flex;align-items:center;font-weight:900;border-right:1.2px solid #111;font-size:10px}
.meta div:last-child{border-right:0}
.freight-type-big{font-size:10px;font-weight:900;margin-left:1mm}.route-big{font-size:11px;font-weight:900;margin-left:1mm}

.info{height:21mm;display:grid;grid-template-columns:1fr 1fr 1.22fr;border-bottom:1.2px solid #111}
.col+.col{border-left:1px solid #111}
.cell{padding:1.8mm 2.2mm;border-bottom:1px solid #111;line-height:1.15;min-height:8mm}
.cell:last-child{border:0}
.party{font-weight:900;font-size:10.5px}
.qty-big{font-size:11px;font-weight:900}
.invoice-big{font-size:10px;font-weight:900}
.invoice-value-big{font-size:9px;font-weight:900}

.body{height:25.5mm;display:grid;grid-template-columns:1fr 48mm;border-bottom:1.2px solid #111}
.goodshead,.goodsrow{display:grid;grid-template-columns:11mm 1.25fr 13mm 1.15fr}
.goodshead{height:6.5mm;background:#fff;font-weight:900;font-size:7.5px}
.goodshead div,.goodsrow div{padding:1.1mm;display:flex;align-items:center;justify-content:center;border-right:1px solid #111}
.goodsrow{height:8.5mm}
.goodsrow div:nth-child(2),.goodsrow div:nth-child(4){justify-content:flex-start;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty-table-big{font-size:11px;font-weight:900}
.charges{border-left:1px solid #111;display:grid;grid-template-columns:1fr 18mm;grid-template-rows:repeat(5,5.4mm)}
.charge{display:contents}
.charge div{padding:1.25mm 1.4mm;border-bottom:1px solid #111;font-weight:800}
.charge div:first-child{border-right:1px solid #111}
.total{font-weight:900}
.total-amount{font-size:11px!important;font-weight:900!important}
.charges .charge:last-child div{border-bottom:0}

.footer{height:13.7mm;display:grid;grid-template-columns:1fr 48mm}
.remark{padding:1.5mm 2mm;font-size:7px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sign{border-left:1px solid #111;padding:1.6mm 2mm}
.signbox{border:0;height:100%;font-weight:900}
}
</style>
</head>

<body>
<div class="top">
<div class="topin">
<b>🧾 NRT ONLINE BILTY / LR</b>
<a href="index.html">← Website</a>
</div>
</div>

<div class="wrap">

<div class="box" id="loginBox">
<h2 class="title">NRT Staff Login</h2>
<div class="grid">
<div><label>Email</label><input id="email" type="email"></div>
<div><label>Password</label><input id="password" type="password"></div>
</div>
<div class="actions">
<button class="blue" onclick="login()">Login</button>
</div>
<div id="loginMsg" class="msg"></div>
</div>

<div id="app" style="display:none">
<div class="box">
<h2 class="title">New / Edit Bilty</h2>

<div class="grid">
<div><label>LR Number</label><input id="lr_no" readonly></div>
<div><label>Date</label><input id="lr_date" type="date"></div>
<div><label>Vehicle No.</label><input id="vehicle_no"></div>

<div>
<label>Freight Type</label>
<select id="freight_type">
<option>TO PAY</option>
<option>PAID</option>
<option>ON ACCOUNT</option>
</select>
</div>

<div><label>From</label><input id="from_location" value="HYDERABAD"></div>
<div><label>To</label><input id="to_location"></div>

<div><label>Consignor Name</label><input id="consignor_name" list="partyNames"></div>
<div><label>Consignor Phone</label><input id="consignor_phone"></div>
<div><label>Consignee Name</label><input id="consignee_name" list="partyNames"></div>
<div><label>Consignee Phone</label><input id="consignee_phone"></div>

<div><label>Packages / Qty</label><input id="packages" type="number" min="0" value="0"></div>
<div><label>Weight</label><input id="weight" type="number" min="0" value="0"></div>

<div class="full"><label>Goods / Description</label><input id="goods"></div>

<div><label>Invoice Number</label><input id="invoice_no"></div>
<div><label>Invoice Value</label><input id="invoice_value" type="number" min="0" value="0"></div>
<div><label>Freight</label><input id="freight" type="number" min="0" value="0"></div>
<div><label>Hamali Charge</label><input id="hamali" type="number" min="0" value="0"></div>
<div><label>LR CHARGE</label><input id="other_charges" type="number" min="0" value="0"></div>

<div class="full"><label>Remarks</label><textarea id="remarks"></textarea></div>
</div>

<div class="actions">
<button class="blue" onclick="saveLR()">💾 Save Bilty</button>
<button class="yellow" onclick="printLR()">🖨️ Print / PDF</button>
<button class="gray" onclick="clearForm()">Clear</button>
<button class="green" onclick="location.href='reports.html'">📊 Reports</button>
<button class="red" onclick="logout()">Logout</button>
</div>
<div id="msg" class="msg"></div>
</div>
</div>
</div>

<datalist id="partyNames"></datalist>
<div id="printArea" class="printarea"></div>

<script>
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),editingId=null;

const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);

function msg(t){$('msg').textContent=t}

function esc(x){
return String(x??'').replace(/[&<>"]/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;'
}[m]))
}

function money(x){
return '₹'+Number(x||0).toLocaleString('en-IN')
}

async function login(){
let{error}=await sb.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});
if(error){$('loginMsg').textContent=error.message;return}
showApp()
}

async function logout(){
await sb.auth.signOut();
location.reload()
}

async function nextLR(){
let{data,error}=await sb.from('lrs').select('lr_no').like('lr_no','NRT/%').limit(1000);
if(error)throw error;
let max=0;
(data||[]).forEach(x=>{
let m=String(x.lr_no||'').match(/^NRT\/(\d+)$/);
if(m)max=Math.max(max,+m[1])
});
return 'NRT/'+(max?max+1:45243)
}

async function showApp(){
$('loginBox').style.display='none';
$('app').style.display='block';
$('lr_date').value=today();
$('from_location').value='HYDERABAD';
$('lr_no').value=await nextLR();
loadParties()
}

async function loadParties(){
let{data}=await sb.from('lrs')
.select('consignor_name,consignor_phone,consignee_name,consignee_phone')
.limit(1000);

let map={};
(data||[]).forEach(r=>{
if(r.consignor_name)map[r.consignor_name]=r.consignor_phone||'';
if(r.consignee_name)map[r.consignee_name]=r.consignee_phone||''
});

$('partyNames').innerHTML=Object.keys(map)
.map(n=>`<option value="${esc(n)}">`).join('');

$('consignor_name').onchange=()=>{
let r=(data||[]).find(x=>
x.consignor_name===$('consignor_name').value||
x.consignee_name===$('consignor_name').value
);
if(r)$('consignor_phone').value=
r.consignor_name===$('consignor_name').value?
r.consignor_phone:r.consignee_phone
};

$('consignee_name').onchange=()=>{
let r=(data||[]).find(x=>
x.consignee_name===$('consignee_name').value||
x.consignor_name===$('consignee_name').value
);
if(r)$('consignee_phone').value=
r.consignee_name===$('consignee_name').value?
r.consignee_phone:r.consignor_phone
}
}

function row(){
return{
lr_no:$('lr_no').value,
lr_date:$('lr_date').value,
vehicle_no:$('vehicle_no').value,
from_location:$('from_location').value,
to_location:$('to_location').value,
freight_type:$('freight_type').value,
consignor_name:$('consignor_name').value,
consignor_phone:$('consignor_phone').value,
consignee_name:$('consignee_name').value,
consignee_phone:$('consignee_phone').value,
packages:+$('packages').value||0,
weight:+$('weight').value||0,
goods:$('goods').value,
invoice_no:$('invoice_no').value,
invoice_value:+$('invoice_value').value||0,
freight:+$('freight').value||0,
hamali:+$('hamali').value||0,
other_charges:+$('other_charges').value||0,
remarks:$('remarks').value,
status:'Booked'
}
}

async function saveLR(){
let r=row();
let q=editingId?
sb.from('lrs').update(r).eq('id',editingId):
sb.from('lrs').insert(r);

let{error}=await q;
if(error){msg(error.message);return}

msg(`${r.lr_no} saved successfully.`);
editingId=null;
printLR();

setTimeout(async()=>{
$('lr_no').value=await nextLR()
},300)
}

function clearForm(){
editingId=null;
$('lr_date').value=today();
$('from_location').value='HYDERABAD';

['vehicle_no','to_location','consignor_name','consignor_phone',
'consignee_name','consignee_phone','goods','invoice_no','remarks']
.forEach(id=>$(id).value='');

['packages','weight','invoice_value','freight','hamali','other_charges']
.forEach(id=>$(id).value=0);

nextLR().then(x=>$('lr_no').value=x)
}

async function loadLR(id){
const {data,error}=await sb.from('lrs').select('*').eq('id',id).single();
if(error){alert('LR data load failed: '+error.message);return null}
if(!data){alert('LR record not found');return null}
return data
}

function fillForm(r){
const f={lr_no:r.lr_no||'',lr_date:r.lr_date||'',vehicle_no:r.vehicle_no||'',freight_type:r.freight_type||'TO PAY',from_location:r.from_location||'',to_location:r.to_location||'',consignor_name:r.consignor_name||'',consignor_phone:r.consignor_phone||'',consignee_name:r.consignee_name||'',consignee_phone:r.consignee_phone||'',packages:r.packages||0,weight:r.weight||0,goods:r.goods||'',invoice_no:r.invoice_no||'',invoice_value:r.invoice_value||0,freight:r.freight||0,hamali:r.hamali||0,other_charges:r.other_charges||0,remarks:r.remarks||''};
Object.keys(f).forEach(k=>{if($(k))$(k).value=f[k]})
}

function setFormReadOnly(on){
document.querySelectorAll('#app input,#app select,#app textarea').forEach(e=>e.disabled=on);
document.querySelectorAll('#app .actions button').forEach(b=>b.style.display=on?'none':'');
}

async function openRequestedLR(mode,id){
const r=await loadLR(id);
if(!r)return;
$('loginBox').style.display='none';
$('app').style.display='block';
fillForm(r);
editingId=r.id;
setFormReadOnly(mode==='view');
}

async function printLR(){

const params=new URLSearchParams(window.location.search);
const printId=params.get('print');

let r;

if(printId){

r=await loadLR(printId);
if(!r)return;

}else{

r=row();

}

let total=Number(r.freight||0)+Number(r.hamali||0)+Number(r.other_charges||0);
let copies=['CONSIGNOR COPY','CONSIGNEE COPY','TRANSPORT COPY'];

$('printArea').innerHTML='<div class="sheet">'+copies.map(c=>`

<div class="copy">

<div class="copyhead">
<div class="brand">
<div class="company">NANDHISHWARA ROAD TRANSPORT</div>
<div class="address">Plot No. 1, Block No. 8, Autonagar, Hyderabad, Telangana - 500070</div>
<div class="phone">Mobile : 9885410410 / 9989581732</div>
<div class="service">ONE DAY DELIVERY SERVICE</div>
</div>

<div class="side">
<div class="sidetop">
<div class="gstbox">GST No : 36HSYPK0996J1ZM</div>
<div class="copyname">${c}</div>
</div>

<div class="lrbox">
<div>LR No : <b class="lrno-big">${esc(r.lr_no)}</b></div>
<div>Date : <b class="date-big">${esc(r.lr_date)}</b></div>
</div>
</div>
</div>

<div class="meta">
<div>FROM : <b class="route-big">${esc(r.from_location)}</b></div>
<div>TO : <b class="route-big">${esc(r.to_location)}</b></div>
<div>Freight Type : <b class="freight-type-big">${esc(r.freight_type||'TO PAY')}</b></div>
</div>

<div class="info">

<div class="col">
<div class="cell">
<b>CONSIGNOR :</b> <span class="party">${esc(r.consignor_name)}</span><br>
<b>Mobile :</b> <span class="party">${esc(r.consignor_phone)}</span>
</div>
<div class="cell">
<b>Qty :</b> <span class="qty-big">${esc(r.packages)}</span>
&nbsp; <b>Packing :</b> Bag / Box / Drums
</div>
</div>

<div class="col">
<div class="cell">
<b>CONSIGNEE :</b> <span class="party">${esc(r.consignee_name)}</span><br>
<b>Mobile :</b> <span class="party">${esc(r.consignee_phone)}</span>
</div>
<div class="cell">
<b>INV :</b> <b class="invoice-big">${esc(r.invoice_no)}</b>
&nbsp;&nbsp; <b>VALUE :</b> <b class="invoice-value-big">${money(r.invoice_value)}</b>
</div>
</div>

<div class="col">
<div class="cell"><b>Vehicle No :</b> <span class="party">${esc(r.vehicle_no)}</span></div>
<div class="cell"><b>Delivery :</b> Door Delivery / One Day Service</div>
</div>

</div>

<div class="body">

<div>
<div class="goodshead">
<div>S.No.</div>
<div>Description</div>
<div>Qty</div>
<div>Remarks</div>
</div>

<div class="goodsrow">
<div>1</div>
<div>${esc(r.goods)}</div>
<div class="qty-table-big">${esc(r.packages)}</div>
<div>${esc(r.remarks)}</div>
</div>
</div>

<div class="charges">

<div class="charge">
<div>Freight</div>
<div>${money(r.freight)}</div>
</div>

<div class="charge">
<div>Stationary</div>
<div>₹0</div>
</div>

<div class="charge">
<div>Hamali</div>
<div>${money(r.hamali)}</div>
</div>

<div class="charge">
<div>LR Charge</div>
<div>${money(r.other_charges)}</div>
</div>

<div class="charge">
<div class="total">Total</div>
<div class="total total-amount">${money(total)}</div>
</div>

</div>
</div>

<div class="footer">
<div class="remark">
<b>Remarks :</b> ${esc(r.remarks)} &nbsp;&nbsp; <b>GST Paid By :</b> Not Applicable &nbsp;&nbsp; Goods booked at owner's risk and said to contain basis. Non Negotiable
</div>

<div class="sign">
<div class="signbox">
Receiver's Sign :<br><br>
________________________
</div>
</div>
</div>

</div>

`).join('')+'</div>';

window.print();
}

window.addEventListener('load',async()=>{

let{data:{session}}=await sb.auth.getSession();

if(!session)return;

const params=new URLSearchParams(window.location.search);
const printId=params.get('print');
const viewId=params.get('view');
const editId=params.get('edit');

if(printId){

$('loginBox').style.display='none';
$('app').style.display='none';
await printLR();

}else if(viewId){

await openRequestedLR('view',viewId);

}else if(editId){

await openRequestedLR('edit',editId);

}else{

showApp();

}

});
</script>
</body>
</html>
