<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NRT Professional LR</title>
<style>
*{box-sizing:border-box}
@page{size:A4 portrait;margin:0}
html,body{margin:0;padding:0;background:#ddd;color:#111;font-family:Arial,Helvetica,sans-serif}
.page{width:210mm;height:297mm;background:#fff;margin:4mm auto;padding:3mm;overflow:hidden}
.copy{height:96.1mm;border:1.4px solid #111;margin-bottom:1.15mm;overflow:hidden}
.copy:last-child{margin-bottom:0}
.header{height:27.5mm;display:grid;grid-template-columns:1fr 79mm;border-bottom:1.2px solid #111}
.brand{padding:2.2mm 2.5mm}
.company{font-size:15.5px;font-weight:900;line-height:1.05}
.address{font-size:7.2px;font-weight:700;margin-top:1.2mm}
.mobile{font-size:8px;font-weight:900;margin-top:1mm}
.tag{font-size:8.2px;font-weight:900;margin-top:.8mm}
.right{border-left:1.2px solid #111;display:grid;grid-template-columns:1fr 31mm;grid-template-rows:9.5mm 18mm}
.gst{padding:2.2mm;font-size:8px;font-weight:900;border-bottom:1px solid #111}
.copyname{background:#111;color:#fff;text-align:center;font-size:8.5px;font-weight:900;padding:3mm 1mm}
.lrdate{grid-column:1/3;display:grid;grid-template-columns:1fr 1fr}
.lrdate div{padding:3mm 2mm;font-size:8px;font-weight:900}
.lrdate div+div{border-left:1px solid #111}
.route{height:8mm;display:grid;grid-template-columns:1fr 1.45fr 1.4fr;border-bottom:1px solid #111}
.cell{padding:1.8mm 2mm;font-size:7.2px}
.cell+.cell{border-left:1px solid #111}
.label{font-weight:900}
.party{height:20.5mm;display:grid;grid-template-columns:1fr 1fr 1.22fr;border-bottom:1px solid #111}
.partycell{padding:1.5mm 2mm}
.partytitle{font-size:7px;font-weight:900}
.partyname{font-size:9.5px;font-weight:900;margin-top:.5mm}
.partyphone{font-size:7.7px;font-weight:900;margin-top:1mm}
.gstline{font-size:6.8px;margin-top:.6mm}
.invoice{border-left:1px solid #111}
.inv{height:6.75mm;padding:1.6mm 2mm;font-size:7px;border-bottom:1px solid #111}
.inv:last-child{border-bottom:0}
.middle{height:27mm;display:grid;grid-template-columns:1fr 48mm;border-bottom:1px solid #111}
.goods{display:grid;grid-template-columns:11mm 1.25fr 13mm 1.15fr;grid-template-rows:7mm 20mm}
.goods div{border-right:1px solid #111;padding:1.6mm 1.2mm;font-size:6.8px}
.goods .th{background:#f1f1f1;font-weight:900;text-align:center;font-size:7px}
.charges{display:grid;grid-template-columns:1fr 18mm;grid-template-rows:repeat(5,5.4mm)}
.charges div{padding:1.3mm 1.4mm;font-size:6.8px;border-bottom:1px solid #111}
.charges .cl{font-weight:900;border-right:1px solid #111}
.charges .last{border-bottom:0}
.charges .total{font-weight:900}
.footer{height:12.2mm;display:grid;grid-template-columns:1fr 48mm}
.remarks{padding:1.4mm 2mm;font-size:6.5px;line-height:1.25}
.sign{border-left:1px solid #111;padding:1.8mm 2mm;font-size:7px;font-weight:900}
@media print{html,body{background:#fff}.page{width:210mm;height:297mm;margin:0;padding:3mm}}
</style>
</head>
<body><div class="page">
<script>
function makeCopy(copyName){
document.write(`
<section class="copy">
<div class="header">
<div class="brand">
<div class="company">NANDHISHWARA ROAD TRANSPORT</div>
<div class="address">Plot No. 1, Block No. 8, Autonagar, Hyderabad, Telangana - 500070</div>
<div class="mobile">Mobile : 9885410410 / 9989581732</div>
<div class="tag">ONE DAY DELIVERY SERVICE</div>
</div>
<div class="right">
<div class="gst">GST No : 36HSYPK0996J1ZM</div>
<div class="copyname">${copyName}</div>
<div class="lrdate"><div>LR No : __________________</div><div>Date : ____ / ____ / ______</div></div>
</div>
</div>
<div class="route">
<div class="cell"><span class="label">From :</span> Hyderabad</div>
<div class="cell"><span class="label">To :</span> ______________________________</div>
<div class="cell"><span class="label">Freight Type :</span> TO PAY ☐ &nbsp; PAID ☐ &nbsp; ON ACCOUNT ☐</div>
</div>
<div class="party">
<div class="partycell"><div class="partytitle">CONSIGNOR</div><div class="partyname">____________________________</div><div class="partyphone">Mobile : ____________________</div><div class="gstline">GST : ________________________</div></div>
<div class="partycell"><div class="partytitle">CONSIGNEE</div><div class="partyname">____________________________</div><div class="partyphone">Mobile : ____________________</div><div class="gstline">GST : ________________________</div></div>
<div class="invoice"><div class="inv"><b>Invoice No. :</b> __________________________</div><div class="inv"><b>Invoice Value :</b> ₹ ____________________</div><div class="inv"><b>No. of Packages :</b> __________ &nbsp; <b>Packing :</b> Bag / Box / Drums</div></div>
</div>
<div class="middle">
<div class="goods"><div class="th">S.No.</div><div class="th">Description</div><div class="th">Qty.</div><div class="th">Goods / Remarks</div><div>1</div><div></div><div></div><div></div></div>
<div class="charges"><div class="cl">Freight</div><div>₹ __________</div><div class="cl">Stationary</div><div>₹ __________</div><div class="cl">Hamali</div><div>₹ __________</div><div class="cl">LR Charge</div><div>₹ __________</div><div class="cl total last">TOTAL</div><div class="total last">₹ __________</div></div>
</div>
<div class="footer"><div class="remarks"><b>Remarks :</b> ___________________________________________________________________________________<br><b>GST Paid By :</b> Consignor ☐ &nbsp;&nbsp; Consignee ☐ &nbsp;&nbsp;&nbsp; Goods booked at owner's risk and said to contain basis. Non Negotiable</div><div class="sign">Receiver's Sign :<br><br>____________________________</div></div>
</section>`);
}
makeCopy("CONSIGNOR COPY");makeCopy("CONSIGNEE COPY");makeCopy("TRANSPORT COPY");
</script></div></body></html>
