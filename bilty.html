<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NRT Online Bilty / LR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033}.top{background:#0c4d96;color:#fff;padding:15px}.topin{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none}.wrap{max-width:1150px;margin:auto;padding:20px}.box{background:#fff;border:1px solid #e1e7ef;border-radius:14px;padding:20px;margin-bottom:18px}.title{color:#1257a6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#536177;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cfd7e3;border-radius:8px;font-size:14px}textarea{min-height:70px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}button{border:0;border-radius:9px;padding:12px 17px;font-weight:800;cursor:pointer}.blue{background:#1257a6;color:white}.yellow{background:#ffd21c;color:#15396b}.red{background:#dc2626;color:#fff}.gray{background:#e8edf4}.danger{background:#c62828;color:#fff}.msg{margin-top:10px;font-weight:700}.search{display:flex;gap:8px}.search input{flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e5eaf1;text-align:left;white-space:nowrap}.badge{padding:5px 8px;border-radius:12px;background:#eaf3ff;color:#1257a6;font-weight:800}.printarea{display:none}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px}.topin{gap:8px}.search{flex-direction:column}}
@media print{
@page{size:A4 portrait !important;margin:0 !important}
html,body{width:210mm!important;height:297mm!important;margin:0!important;padding:0!important;background:#fff!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
.top,.wrap>*:not(#printArea){display:none!important}.wrap{margin:0!important;padding:0!important}
.printarea{display:block!important;width:210mm!important;height:297mm!important;overflow:hidden!important;margin:0!important;padding:0!important}
.sheet{width:210mm!important;height:297mm!important;box-sizing:border-box!important;padding:3mm 6mm!important;margin:0!important;background:#fff!important;display:flex!important;flex-direction:column!important;gap:1mm!important;overflow:hidden!important}
.copy{width:198mm!important;height:95.8mm!important;min-height:95.8mm!important;max-height:95.8mm!important;box-sizing:border-box!important;border:1px solid #111!important;margin:0!important;padding:0!important;position:relative;overflow:hidden!important;font-size:8px;page-break-inside:avoid!important;break-inside:avoid!important;display:block!important;color:#111;background:#fff}
.copy-header{height:19.5mm;border-bottom:1px solid #111;position:relative;display:grid;grid-template-columns:72% 28%;align-items:stretch}.copy-header .brand{padding:1.7mm 2mm 0;text-align:left}.copy-header .company{font-size:15px;font-weight:900;line-height:1.05;white-space:nowrap;letter-spacing:.15px}.copy-header .address{font-size:8px;font-weight:800;margin-top:.8mm;line-height:1.15}.copy-header .gst{font-size:8px;font-weight:900;margin-top:.4mm;line-height:1.15}.copy-header .service{font-size:8.5px;font-weight:900;margin-top:.45mm;letter-spacing:.35px}.copy-side{border-left:1px solid #111;display:flex;flex-direction:column}.side-top{height:8.5mm;display:grid;grid-template-columns:76% 24%;border-bottom:1px solid #111}.gstbox{display:flex;align-items:center;justify-content:center;padding:0 .6mm;font-size:9px;font-weight:900;white-space:nowrap;overflow:visible;letter-spacing:-.1px;border:0}.copy-label{display:flex;align-items:center;justify-content:center;border-left:1px solid #111;font-size:8.5px;font-weight:900;letter-spacing:.15px;text-align:center}.lrbox{height:11mm;display:grid;grid-template-columns:1fr 1fr;font-size:9px;font-weight:900}.lrbox>div{display:flex;align-items:center;justify-content:center;padding:0 1mm;white-space:nowrap}.lrbox>div+div{border-left:1px solid #111}.meta2{height:8.5mm;display:grid;grid-template-columns:28% 42% 30%;border-bottom:1px solid #111}.meta2>div{padding:1mm 1.5mm;display:flex;align-items:center;font-weight:900;font-size:8.5px;white-space:nowrap;overflow:hidden}.meta2>div+div{border-left:1px solid #111}.info{height:17.5mm;display:grid;grid-template-columns:39% 36% 25%;border-bottom:1px solid #111}.info>.col{overflow:hidden}.info>.col+.col{border-left:1px solid #111}.cell{padding:.9mm 1.5mm;font-size:8.5px;border-bottom:1px solid #111;min-height:5.7mm;line-height:1.08;overflow:hidden}.cell:last-child{border-bottom:0}.cell b{font-weight:900}.person-name{font-size:10px;font-weight:900}.qty-value,.packing-value{font-size:9.5px;font-weight:900}.bodyrow{height:33mm;display:grid;grid-template-columns:72% 28%;border-bottom:1px solid #111}.goods{overflow:hidden}.goods-head,.goods-row{display:grid;grid-template-columns:11% 31% 10% 48%}.goods-head{height:6mm;font-weight:900;font-size:8px;text-align:center;background:#eef5fb;border-bottom:1px solid #111}.goods-head>div,.goods-row>div{display:flex;align-items:center;justify-content:center;padding:.7mm 1mm;border-right:1px solid #111;overflow:hidden}.goods-head>div:last-child,.goods-row>div:last-child{border-right:0}.goods-row{min-height:5mm;font-size:8px}.goods-row>div:nth-child(2),.goods-row>div:nth-child(4){justify-content:flex-start}.goods-fill{height:22mm;border-top:1px solid #ddd}.charges{border-left:1px solid #111;overflow:hidden}.charge-row{display:grid;grid-template-columns:63% 37%;min-height:3.7mm;border-bottom:1px solid #111}.charge-row>div{padding:.55mm 1.2mm;font-weight:800;font-size:8px;line-height:1.05;display:flex;align-items:center}.charge-row>div+div{border-left:1px solid #111;justify-content:flex-end}.charge-total{font-size:9.5px;font-weight:900;min-height:5.2mm}.footer{height:16mm;display:grid;grid-template-columns:65% 35%;position:relative}.footer-left{overflow:hidden}.remark{height:6mm;padding:1mm 1.5mm;border-bottom:1px solid #111;font-weight:800;font-size:8px;white-space:nowrap;overflow:hidden}.risk{padding:.8mm 1.5mm;font-size:7px;font-weight:700;line-height:1.1}.gstline{padding:.5mm 1.5mm;font-size:7px;font-weight:800}.receiver{border-left:1px solid #111;display:flex;align-items:stretch;padding:1.2mm}.receiver-box{width:100%;border:1px solid #111;display:flex;align-items:flex-start;padding:1mm 1.2mm;font-weight:900;font-size:8px}.receiver-box span{font-weight:900}
}
</style></head><body>
<div class="top"><div class="topin"><b>🧾 NRT ONLINE BILTY / LR</b><a href="index.html">← Website</a></div></div>
<div class="wrap">
<div class="box" id="loginBox"><h2 class="title">NRT Staff Login</h2><div class="grid"><div><label>Email</label><input id="email" type="email" placeholder="NRT account email"></div><div><label>Password</label><input id="password" type="password" placeholder="Password"></div></div><div class="actions"><button class="blue" onclick="login()">Login</button><button class="gray" onclick="signup()">Create account</button></div><div id="loginMsg" class="msg"></div></div>
<div id="app" style="display:none"><div class="box"><h2 class="title">Create New Bilty / LR</h2><div class="grid">
<div><label>LR Number</label><input id="lr_no" value="NRT/45243"></div><div><label>LR Date</label><input id="lr_date" type="date"></div>
<div><label>Vehicle Number</label><input id="vehicle_no" placeholder="TS / TG 00 XX 0000"></div><div><label>Delivery Type</label><select id="delivery_type"><option>One Day Delivery</option><option>Door Delivery</option><option>Regular Transport</option></select></div>
<div><label>Freight Type</label><select id="freight_type"><option value="TO PAY">TO PAY</option><option value="PAID">PAID</option><option value="ON ACCOUNT">ON ACCOUNT</option></select></div><div><label>From</label><input id="from_location" value="Hyderabad"></div><div><label>To</label><input id="to_location" placeholder="Destination"></div>
<div><label>Consignor Name</label><input id="consignor_name"></div><div><label>Consignor Phone</label><input id="consignor_phone"></div><div><label>Consignor GST</label><input id="consignor_gst"></div>
<div><label>Consignee Name</label><input id="consignee_name"></div><div><label>Consignee Phone</label><input id="consignee_phone"></div><div><label>Consignee GST</label><input id="consignee_gst"></div>
<div><label>Packages</label><input id="packages" type="number" min="0" value="1"></div><div><label>Packing Type</label><input id="packing_type" placeholder="Bag / Box / Drums"></div><div class="full"><label>Goods Description</label><input id="goods" placeholder="Seeds / Auto Parts / Medicine / Machinery / General Goods"></div>
<div><label>Invoice No.</label><input id="invoice_no"></div><div><label>Invoice Value (₹)</label><input id="invoice_value" type="number" min="0" value="0"></div><div><label>E-Way Bill No.</label><input id="eway_bill"></div><div><label>Delivery At</label><input id="delivery_at" placeholder="Godown / Door / Office"></div>
<div><label>Freight (₹)</label><input id="freight" type="number" min="0" value="0"></div><div><label>Stationary (₹)</label><input id="stationary" type="number" min="0" value="0"></div><div><label>Hamali (₹)</label><input id="hamali" type="number" min="0" value="0"></div><div><label>Door Pickup (₹)</label><input id="door_pickup" type="number" min="0" value="0"></div><div><label>Door Delivery (₹)</label><input id="door_delivery" type="number" min="0" value="0"></div><div><label>Insurance (₹)</label><input id="insurance" type="number" min="0" value="0"></div><div><label>Other (₹)</label><input id="other_charges" type="number" min="0" value="0"></div><div><label>GST Paid By</label><select id="gst_paid_by"><option>Not Applicable</option><option>Consignor</option><option>Consignee</option><option>NRT</option></select></div><div class="full"><label>Remarks</label><textarea id="remarks"></textarea></div>
</div><div class="actions"><button class="yellow" onclick="saveLR()">💾 Save LR</button><button class="blue" onclick="printLR()">🖨️ A4 3 Copies</button><button class="gray" onclick="clearForm()">New</button><button class="danger" onclick="logout()">Logout</button></div><div id="msg" class="msg"></div></div>
<div class="box"><h2 class="title">LR Search / Records</h2><div class="search"><input id="search" placeholder="Search LR number, consignor, consignee, destination..." oninput="loadRecords()"><button class="blue" onclick="loadRecords()">Search</button><button class="gray" onclick="clearSearch()">Clear</button></div><div class="tablewrap"><table><thead><tr><th>LR</th><th>Date</th><th>Consignor</th><th>To</th><th>Consignee</th><th>Status</th><th>Print</th><th>Edit</th><th>Delete</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div>
<div id="printArea" class="printarea"></div>
<script>
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let editingId=null;const $=id=>document.getElementById(id);function configured(){return SUPABASE_URL.startsWith("http")&&!SUPABASE_PUBLISHABLE_KEY.includes("PASTE_")}function today(){return new Date().toISOString().slice(0,10)}
async function login(){if(!configured())return setLogin("First fill supabase-config.js with Project URL and Publishable Key.");let{data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return setLogin(error.message);setLogin("Logged in.");showApp()}async function signup(){if(!configured())return setLogin("First configure Supabase.");let{error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});setLogin(error?error.message:"Account created. Check email if confirmation is enabled.")}function setLogin(x){$('loginMsg').textContent=x}async function logout(){await sb.auth.signOut();$('app').style.display='none';$('loginBox').style.display='block'}
async function showApp(){let{data:{session}}=await sb.auth.getSession();if(!session)return;$('loginBox').style.display='none';$('app').style.display='block';$('lr_date').value=today();let{data:existing,error:listError}=await sb.from('lrs').select('lr_no').like('lr_no','NRT/%').limit(1000);if(listError){$('msg').textContent=listError.message;return}let maxNo=0;(existing||[]).forEach(x=>{let m=String(x.lr_no||'').match(/^NRT\/(\d+)$/);if(m)maxNo=Math.max(maxNo,Number(m[1]))});let nextNo=maxNo?maxNo+1:45243;$('lr_no').value='NRT/'+nextNo;$('lr_no').readOnly=true;$('msg').textContent='Next LR Number: NRT/'+nextNo+' (saved when you press Save LR)';loadRecords()}
function val(id){return $(id)?$(id).value.trim():''}function num(id){return Number(val(id)||0)}function packingFromRemarks(x){let m=String(x||'').match(/\n?\[PACKING_TYPE:(.*?)\]\s*$/);return m?m[1]:''} function cleanRemarks(x){return String(x||'').replace(/\n?\[PACKING_TYPE:.*?\]\s*$/,'').trim()} function storedRemarks(){let r=val('remarks'),p=val('packing_type');return p?(r+'\n[PACKING_TYPE:'+p.replace(/]/g,'')+']').trim():r} function clearSearch(){$('search').value='';loadRecords()}
function makeRow(){return{lr_no:val('lr_no'),lr_date:val('lr_date'),vehicle_no:val('vehicle_no'),from_location:val('from_location'),to_location:val('to_location'),delivery_type:val('delivery_type'),freight_type:val('freight_type'),consignor_name:val('consignor_name'),consignor_phone:val('consignor_phone'),consignee_name:val('consignee_name'),consignee_phone:val('consignee_phone'),packages:num('packages'),goods:val('goods'),freight:num('freight'),other_charges:num('other_charges'),remarks:storedRemarks(),status:'Booked'}}
async function saveLR(){
 let row=makeRow();
 if(editingId){let{error}=await sb.from('lrs').update(row).eq('id',editingId).select();if(error){$('msg').textContent=error.message;return}$('msg').textContent=`${row.lr_no} updated successfully.`;editingId=null;$('lr_no').readOnly=true;printLR();loadRecords();return}
 let{data:existing,error:listError}=await sb.from('lrs').select('lr_no').like('lr_no','NRT/%').limit(1000);if(listError){$('msg').textContent=listError.message;return}
 let maxNo=0;(existing||[]).forEach(x=>{let m=String(x.lr_no||'').match(/^NRT\/(\d+)$/);if(m)maxNo=Math.max(maxNo,Number(m[1]))});let nextNo=maxNo?maxNo+1:45243;$('lr_no').value='NRT/'+nextNo;row=makeRow();let{error}=await sb.from('lrs').insert(row);if(error){$('msg').textContent=error.message;return}$('lr_no').readOnly=true;$('msg').textContent=`${row.lr_no} saved successfully.`;printLR();loadRecords()}
async function loadRecords(){if(!(await sb.auth.getSession()).data.session)return;let q=val('search'),query=sb.from('lrs').select('*').order('id',{ascending:false}).limit(100);if(q)query=query.or(`lr_no.ilike.%${q}%,consignor_name.ilike.%${q}%,to_location.ilike.%${q}%,consignee_name.ilike.%${q}%`);let{data,error}=await query;if(error){$('rows').innerHTML=`<tr><td colspan="9">${error.message}</td></tr>`;return}$('rows').innerHTML=(data||[]).map(r=>`<tr><td><b>${esc(r.lr_no)}</b></td><td>${esc(r.lr_date||'')}</td><td>${esc(r.consignor_name||'')}</td><td>${esc(r.to_location||'')}</td><td>${esc(r.consignee_name||'')}</td><td><span class="badge">${esc(r.status||'Booked')}</span></td><td><button class="gray" onclick='printRecord(${JSON.stringify(r).replace(/'/g,'&#39;')})'>Print</button></td><td><button class="blue" onclick='editRecord(${JSON.stringify(r).replace(/'/g,'&#39;')})'>Edit</button></td><td><button class="red" onclick='deleteRecord(${r.id},${JSON.stringify(r.lr_no)})'>Delete</button></td></tr>`).join('')}
async function deleteRecord(id,lr){if(!confirm('Delete LR '+lr+'? This cannot be undone.'))return;let{error}=await sb.from('lrs').delete().eq('id',id);if(error){$('msg').textContent=error.message;return}$('msg').textContent=`${lr} deleted successfully.`;if(editingId===id){editingId=null;clearForm()}loadRecords()}
function editRecord(r){editingId=r.id;const fields=['lr_no','lr_date','vehicle_no','from_location','to_location','consignor_name','consignor_phone','consignee_name','consignee_phone','goods','freight','other_charges'];fields.forEach(k=>{if($(k))$(k).value=(r[k]??'')});if($('freight_type'))$('freight_type').value=r.freight_type||'TO PAY';if($('packages'))$('packages').value=r.packages??1;if($('packing_type'))$('packing_type').value=packingFromRemarks(r.remarks);if($('remarks'))$('remarks').value=cleanRemarks(r.remarks);$('lr_no').readOnly=true;$('msg').textContent=`Editing ${r.lr_no}. Make changes and press Save LR.`;window.scrollTo({top:0,behavior:'smooth'})}
function clearForm(){editingId=null;['vehicle_no','to_location','consignor_name','consignor_phone','consignor_gst','consignee_name','consignee_phone','consignee_gst','goods','invoice_no','eway_bill','delivery_at','remarks','packing_type'].forEach(x=>$(x).value='');$('packages').value=1;['invoice_value','freight','stationary','hamali','door_pickup','door_delivery','insurance','other_charges'].forEach(x=>$(x).value=0);$('lr_date').value=today();$('lr_no').value='';$('freight_type').value='TO PAY';$('lr_no').readOnly=true;$('msg').textContent='Next LR will be generated automatically on Save'}
function printLR(){renderPrint(makePrintObject());window.print()}function printRecord(r){renderPrint(r);window.print()}
function makePrintObject(){return{lr_no:val('lr_no'),lr_date:val('lr_date'),vehicle_no:val('vehicle_no'),from_location:val('from_location'),to_location:val('to_location'),delivery_type:val('delivery_type'),freight_type:val('freight_type'),consignor_name:val('consignor_name'),consignor_phone:val('consignor_phone'),consignor_gst:val('consignor_gst'),consignee_name:val('consignee_name'),consignee_phone:val('consignee_phone'),consignee_gst:val('consignee_gst'),packages:val('packages'),goods:val('goods'),invoice_no:val('invoice_no'),invoice_value:val('invoice_value'),eway_bill:val('eway_bill'),delivery_at:val('delivery_at'),freight:val('freight'),stationary:val('stationary'),hamali:val('hamali'),door_pickup:val('door_pickup'),door_delivery:val('door_delivery'),insurance:val('insurance'),other_charges:val('other_charges'),gst_paid_by:val('gst_paid_by'),remarks:val('remarks'),packing_type:val('packing_type')}}
function money(x){return '₹'+Number(x||0).toLocaleString('en-IN')}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderPrint(r){let copies=['CONSIGNOR COPY','CONSIGNEE COPY','TRANSPORT COPY'];let total=['freight','stationary','hamali','door_pickup','door_delivery','insurance','other_charges'].reduce((a,k)=>a+Number(r[k]||0),0);let goods=esc(r.goods);$('printArea').innerHTML=`<div class="sheet">${copies.map(c=>`<div class="copy"><div class="copy-header"><div class="brand"><div class="company">NANDHISHWARA ROAD TRANSPORT</div><div class="address">Plot No. 1, Block No. 8, Autonagar, Hyderabad, Telangana - 500070</div><div class="gst">Mobile : 9550801040 / 9550815722</div><div class="service">ONE DAY DELIVERY SERVICE</div></div><div class="copy-side"><div class="side-top"><div class="gstbox">GST No : 36HSYPK0996J1ZM</div><div class="copy-label">${c}</div></div><div class="lrbox"><div>LR No : <b>${esc(r.lr_no)}</b></div><div>Date : <b>${esc(r.lr_date)}</b></div></div></div></div><div class="meta2"><div><b>From :</b>&nbsp; ${esc(r.from_location)}</div><div><b>To :</b>&nbsp; ${esc(r.to_location)}</div><div><b>Freight Type :</b>&nbsp; ${esc(r.freight_type||'TO PAY')}</div></div><div class="info"><div class="col"><div class="cell"><b>Consignor :</b> <span class="person-name">${esc(r.consignor_name)}</span><br><b>Mobile :</b> ${esc(r.consignor_phone)}<br><b>GST :</b> ${esc(r.consignor_gst)}</div><div class="cell"><b>Qty :</b> <span class="qty-value">${esc(r.packages)}</span> &nbsp; <b>Packing :</b> <span class="packing-value">${esc(r.packing_type||packingFromRemarks(r.remarks))}</span></div></div><div class="col"><div class="cell"><b>Consignee :</b> <span class="person-name">${esc(r.consignee_name)}</span><br><b>Mobile :</b> ${esc(r.consignee_phone)}<br><b>GST :</b> ${esc(r.consignee_gst)}</div><div class="cell"><b>INV :</b> ${esc(r.invoice_no)} &nbsp;&nbsp; <b>VALUE :</b> ${money(r.invoice_value)}</div></div><div class="col"><div class="cell"><b>Vehicle No :</b> ${esc(r.vehicle_no)}</div><div class="cell"><b>Delivery Type :</b> ${esc(r.delivery_type)}<br><b>Delivery At :</b> ${esc(r.delivery_at)}</div></div></div><div class="bodyrow"><div class="goods"><div class="goods-head"><div>S.No.</div><div>Description</div><div>Qty.</div><div>Goods / Remarks</div></div><div class="goods-row"><div>1</div><div>${goods}</div><div>${esc(r.packages)}</div><div>${esc(cleanRemarks(r.remarks))}</div></div><div class="goods-fill"></div></div><div class="charges"><div class="charge-row"><div>Freight</div><div>${money(r.freight)}</div></div><div class="charge-row"><div>Stationary</div><div>${money(r.stationary)}</div></div><div class="charge-row"><div>Hamali</div><div>${money(r.hamali)}</div></div><div class="charge-row"><div>Door Pickup</div><div>${money(r.door_pickup)}</div></div><div class="charge-row"><div>Door Delivery</div><div>${money(r.door_delivery)}</div></div><div class="charge-row"><div>Insurance</div><div>${money(r.insurance)}</div></div><div class="charge-row"><div>Other</div><div>${money(r.other_charges)}</div></div><div class="charge-row charge-total"><div>Total</div><div>${money(total)}</div></div></div></div><div class="footer"><div class="footer-left"><div class="remark"><b>Remarks :</b> ${esc(cleanRemarks(r.remarks))}</div><div class="gstline"><b>GST Paid By :</b> ${esc(r.gst_paid_by||'Not Applicable')} &nbsp; <b>E-Way Bill :</b> ${esc(r.eway_bill)}</div><div class="risk">Goods booked at owner's risk and said to contain basis. &nbsp; Non Negotiable</div></div><div class="receiver"><div class="receiver-box"><span>Receiver's Sign :</span></div></div></div></div>`).join('')}</div>`}
</script></body></html>
