<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NRT Online Bilty / LR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:Arial;color:#172033}.top{background:#0c4d96;color:#fff;padding:15px}.topin{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none}.wrap{max-width:1150px;margin:auto;padding:20px}.box{background:#fff;border:1px solid #e1e7ef;border-radius:14px;padding:20px;margin-bottom:18px}.title{color:#1257a6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#536177;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cfd7e3;border-radius:8px;font-size:14px}textarea{min-height:70px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}button{border:0;border-radius:9px;padding:12px 17px;font-weight:800;cursor:pointer}.blue{background:#1257a6;color:white}.yellow{background:#ffd21c;color:#15396b}.gray{background:#e8edf4}.danger{background:#c62828;color:#fff}.msg{margin-top:10px;font-weight:700}.search{display:flex;gap:8px}.search input{flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e5eaf1;text-align:left;white-space:nowrap}.badge{padding:5px 8px;border-radius:12px;background:#eaf3ff;color:#1257a6;font-weight:800}.printarea{display:none}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px}.topin{gap:8px}.search{flex-direction:column}}
@media print{
body{background:#fff}.top,.wrap>*:not(#printArea){display:none!important}.printarea{display:block}
.sheet{width:210mm;height:297mm;padding:6mm}.copy{height:31.7%;border:1.2px solid #111;margin-bottom:2mm;padding:4mm;position:relative}.copy h2{text-align:center;margin:0 0 2mm;font-size:15px}.copy .brand{text-align:center;font-weight:900;font-size:11px}.copy .tag{text-align:center;font-size:9px}.line{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #555;margin-top:2mm}.cell{padding:1.4mm;border-right:1px solid #777;min-height:7mm;font-size:9px}.cell:nth-child(2n){border-right:0}.goods{min-height:14mm}.sign{position:absolute;bottom:3mm;left:4mm;right:4mm;display:flex;justify-content:space-between;font-size:8px}
}
</style></head><body>
<div class="top"><div class="topin"><b>🧾 NRT ONLINE BILTY / LR</b><a href="index.html">← Website</a></div></div>
<div class="wrap">
<div class="box" id="loginBox"><h2 class="title">NRT Staff Login</h2><div class="grid"><div><label>Email</label><input id="email" type="email" placeholder="NRT account email"></div><div><label>Password</label><input id="password" type="password" placeholder="Password"></div></div><div class="actions"><button class="blue" onclick="login()">Login</button><button class="gray" onclick="signup()">Create account</button></div><div id="loginMsg" class="msg"></div></div>
<div id="app" style="display:none">
<div class="box"><h2 class="title">Create New Bilty / LR</h2>
<div class="grid">
<div><label>LR Number</label><input id="lr_no" readonly></div><div><label>LR Date</label><input id="lr_date" type="date"></div>
<div><label>Vehicle Number</label><input id="vehicle_no" placeholder="TS / TG 00 XX 0000"></div><div><label>Delivery Type</label><select id="delivery_type"><option>One Day Delivery</option><option>Door Delivery</option><option>Regular Transport</option></select></div>
<div><label>From</label><input id="from_location" value="Hyderabad"></div><div><label>To</label><input id="to_location" placeholder="Destination"></div>
<div><label>Consignor Name</label><input id="consignor_name"></div><div><label>Consignor Phone</label><input id="consignor_phone"></div>
<div><label>Consignee Name</label><input id="consignee_name"></div><div><label>Consignee Phone</label><input id="consignee_phone"></div>
<div><label>Packages</label><input id="packages" type="number" min="0" value="1"></div><div><label>Weight (Kg)</label><input id="weight" type="number" min="0" step="0.01"></div>
<div class="full"><label>Goods Description</label><input id="goods" placeholder="Seeds / Auto Parts / Medicine / Machinery / General Goods"></div>
<div><label>Freight (₹)</label><input id="freight" type="number" min="0" value="0"></div><div><label>Other Charges (₹)</label><input id="other_charges" type="number" min="0" value="0"></div>
<div class="full"><label>Remarks</label><textarea id="remarks"></textarea></div>
</div><div class="actions"><button class="yellow" onclick="saveLR()">💾 Save LR</button><button class="blue" onclick="printLR()">🖨️ A4 3 Copies</button><button class="gray" onclick="clearForm()">New</button><button class="danger" onclick="logout()">Logout</button></div><div id="msg" class="msg"></div></div>
<div class="box"><h2 class="title">LR Search / Records</h2><div class="search"><input id="search" placeholder="Search LR number, consignee, vehicle, destination..." oninput="loadRecords()"><button class="blue" onclick="loadRecords()">Search</button></div><div class="tablewrap"><table><thead><tr><th>LR</th><th>Date</th><th>Vehicle</th><th>To</th><th>Consignee</th><th>Status</th><th>Print</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div></div>
<div id="printArea" class="printarea"></div>
<script>
const sb = window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let current=null;
const $=id=>document.getElementById(id);
function configured(){return SUPABASE_URL.startsWith("http")&&!SUPABASE_PUBLISHABLE_KEY.includes("PASTE_")}
function today(){return new Date().toISOString().slice(0,10)}
async function login(){if(!configured()){return setLogin("First fill supabase-config.js with Project URL and Publishable Key.");}
let {data,error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value}); if(error)return setLogin(error.message); setLogin("Logged in."); showApp();}
async function signup(){if(!configured())return setLogin("First configure Supabase.");let {error}=await sb.auth.signUp({email:$("email").value,password:$("password").value});setLogin(error?error.message:"Account created. Check email if confirmation is enabled.")}
function setLogin(x){$("loginMsg").textContent=x}
async function logout(){await sb.auth.signOut();$("app").style.display="none";$("loginBox").style.display="block"}
async function showApp(){let {data:{session}}=await sb.auth.getSession();if(!session)return;$("loginBox").style.display="none";$("app").style.display="block";$("lr_date").value=today();await nextLR();loadRecords()}
async function nextLR(){let y=new Date().getFullYear();let {data}=await sb.from("lrs").select("lr_no").like("lr_no",`NRT-${y}-%`).order("id",{ascending:false}).limit(1);let n=1;if(data?.length){let m=data[0].lr_no.match(/(\d+)$/);if(m)n=Number(m[1])+1}$("lr_no").value=`NRT-${y}-${String(n).padStart(5,"0")}`}
function val(id){return $(id).value.trim()}
async function saveLR(){let row={lr_no:val("lr_no"),lr_date:val("lr_date"),vehicle_no:val("vehicle_no"),from_location:val("from_location"),to_location:val("to_location"),delivery_type:val("delivery_type"),consignor_name:val("consignor_name"),consignor_phone:val("consignor_phone"),consignee_name:val("consignee_name"),consignee_phone:val("consignee_phone"),packages:Number(val("packages")||0),weight:Number(val("weight")||0),goods:val("goods"),freight:Number(val("freight")||0),other_charges:Number(val("other_charges")||0),remarks:val("remarks"),status:"Booked"};let {error}=await sb.from("lrs").insert(row);if(error){$("msg").textContent=error.message;return} $("msg").textContent=`${row.lr_no} saved successfully.`;printLR();await nextLR();loadRecords()}
async function loadRecords(){if(!current&&!(await sb.auth.getSession()).data.session)return;let q=val("search"),query=sb.from("lrs").select("*").order("id",{ascending:false}).limit(100);if(q)query=query.or(`lr_no.ilike.%${q}%,vehicle_no.ilike.%${q}%,to_location.ilike.%${q}%,consignee_name.ilike.%${q}%`);let {data,error}=await query;if(error){$("rows").innerHTML=`<tr><td colspan="7">${error.message}</td></tr>`;return}$("rows").innerHTML=(data||[]).map(r=>`<tr><td><b>${r.lr_no}</b></td><td>${r.lr_date||""}</td><td>${r.vehicle_no||""}</td><td>${r.to_location||""}</td><td>${r.consignee_name||""}</td><td><span class="badge">${r.status}</span></td><td><button class="gray" onclick='printRecord(${JSON.stringify(r).replace(/'/g,"&#39;")})'>Print</button></td></tr>`).join("")}
function clearForm(){["vehicle_no","to_location","consignor_name","consignor_phone","consignee_name","consignee_phone","goods","remarks"].forEach(x=>$(x).value="");$("packages").value=1;$("weight").value="";$("freight").value=0;$("other_charges").value=0;$("lr_date").value=today();$("msg").textContent="";nextLR()}
function printLR(){let r={lr_no:val("lr_no"),lr_date:val("lr_date"),vehicle_no:val("vehicle_no"),from_location:val("from_location"),to_location:val("to_location"),delivery_type:val("delivery_type"),consignor_name:val("consignor_name"),consignor_phone:val("consignor_phone"),consignee_name:val("consignee_name"),consignee_phone:val("consignee_phone"),packages:val("packages"),weight:val("weight"),goods:val("goods"),freight:val("freight"),other_charges:val("other_charges"),remarks:val("remarks")};renderPrint(r);window.print()}
function printRecord(r){renderPrint(r);window.print()}
function renderPrint(r){let copies=["CONSIGNOR COPY","CONSIGNEE COPY","TRANSPORTER COPY"];$("printArea").innerHTML=`<div class="sheet">${copies.map(c=>`<div class="copy"><div class="brand">NANDHISHWARA ROAD TRANSPORT</div><div class="tag">ONE DAY DELIVERY SERVICE · ${c}</div><h2>GOODS CONSIGNMENT NOTE / LR</h2><div class="line"><div class="cell"><b>LR No:</b> ${r.lr_no}</div><div class="cell"><b>Date:</b> ${r.lr_date||""}</div><div class="cell"><b>Vehicle:</b> ${r.vehicle_no||""}</div><div class="cell"><b>Delivery:</b> ${r.delivery_type||""}</div><div class="cell"><b>From:</b> ${r.from_location||""}</div><div class="cell"><b>To:</b> ${r.to_location||""}</div><div class="cell"><b>Consignor:</b> ${r.consignor_name||""}<br>${r.consignor_phone||""}</div><div class="cell"><b>Consignee:</b> ${r.consignee_name||""}<br>${r.consignee_phone||""}</div><div class="cell"><b>Packages:</b> ${r.packages||0}</div><div class="cell"><b>Weight:</b> ${r.weight||0} Kg</div><div class="cell goods"><b>Goods:</b> ${r.goods||""}<br><b>Remarks:</b> ${r.remarks||""}</div><div class="cell goods"><b>Freight:</b> ₹${r.freight||0}<br><b>Other:</b> ₹${r.other_charges||0}</div></div><div class="sign"><span>Consignor Signature</span><span>Receiver Signature</span><span>For NRT</span></div></div>`).join("")}</div>`}
sb.auth.onAuthStateChange((event,session)=>{if(session)showApp()});
if(configured())sb.auth.getSession().then(x=>{if(x.data.session)showApp()}); else $("loginMsg").textContent="Supabase setup pending — configure the project keys first.";
</script></body></html>
