<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIVA SHAKTHI ROAD TRANSPORT - Bilty</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#f4f7fb url('shiva-parvathi-background.jpg') center/cover fixed;color:#172033}.top{background:#073b8f;color:#fff;padding:15px}.top a{color:#fff;margin-right:12px}.wrap{max-width:1100px;margin:18px auto;padding:10px}.box{background:#fffffff0;padding:16px;border-radius:10px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:block;font-weight:bold;font-size:12px;margin-bottom:4px}input,select,textarea{width:100%;padding:10px;border:1px solid #bbc5d1;border-radius:6px}.full{grid-column:1/-1}button{padding:10px 14px;border:0;border-radius:6px;font-weight:bold;margin:4px;cursor:pointer}.blue{background:#0756a6;color:white}.yellow{background:#ffd21f}.green{background:#16803c;color:white}.red{background:#b91c1c;color:white}.msg{font-weight:bold;margin-top:8px}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:420px){.grid{grid-template-columns:1fr}}
.printarea{display:none}

html,body{width:210mm!important;height:297mm!important;margin:0!important;padding:0!important;background:#fff!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
.top,.wrap>*:not(#printArea){display:none!important}.wrap{margin:0!important;padding:0!important;max-width:none!important}
.printarea{display:block!important;width:210mm!important;height:297mm!important;overflow:hidden!important;margin:0!important;padding:0!important}
.sheet{width:210mm!important;height:297mm!important;box-sizing:border-box!important;padding:3mm 6mm!important;margin:0!important;background:#fff!important;display:flex!important;flex-direction:column!important;gap:1mm!important;overflow:hidden!important}
.copy{width:198mm!important;height:95.8mm!important;min-height:95.8mm!important;max-height:95.8mm!important;box-sizing:border-box!important;border:1px solid #111!important;margin:0!important;padding:0!important;position:relative;overflow:hidden!important;font-size:8px;page-break-inside:avoid!important;break-inside:avoid!important;display:block!important;color:#111;background:#fff}
.copy-header{height:21mm;border-bottom:1px solid #111;position:relative;display:grid;grid-template-columns:68% 32%;align-items:stretch}.copy-header .brand{padding:1.6mm 2mm 0;text-align:left;overflow:hidden}.copy-header .company{font-size:21px;font-weight:900;line-height:1.05;white-space:nowrap;letter-spacing:0;text-shadow:0 0 .1px #111}.copy-header .address{font-size:10px;font-weight:900;margin-top:1mm;line-height:1.15;white-space:nowrap}.copy-header .gst{font-size:10px;font-weight:900;margin-top:.5mm;line-height:1.15}.copy-header .service{font-size:10px;font-weight:900;margin-top:.5mm;letter-spacing:.25px}.copy-side{border-left:1px solid #111;display:flex;flex-direction:column}.side-top{min-height:8.5mm;display:grid;grid-template-columns:66% 34%;border-bottom:1px solid #111}.gstbox{display:flex;align-items:center;justify-content:center;padding:0 1.5mm;font-size:10px;font-weight:900;white-space:normal;overflow-wrap:anywhere;word-break:normal;text-align:center;line-height:1.15;border:0}.copy-label{display:flex;align-items:center;justify-content:center;border-left:1px solid #111;font-size:8px;font-weight:900;letter-spacing:.1px;text-align:center}.lrbox{flex:1;display:grid;grid-template-columns:1.08fr 1fr;font-size:9px;font-weight:900;min-width:0}.lrbox>div{display:flex;align-items:center;justify-content:center;padding:0 .6mm;white-space:nowrap;overflow:hidden;line-height:1.1;font-size:9px;min-width:0}.lrbox>div+div{border-left:1px solid #111}.meta2{min-height:9mm;display:grid;grid-template-columns:28% 39% 33%;border-bottom:1px solid #111}.meta2>div{padding:1.2mm 1.5mm;display:flex;align-items:center;font-weight:900;font-size:9px;white-space:normal;overflow:hidden;line-height:1.15}.meta2>div+div{border-left:1px solid #111}.meta2 .freight-type{font-size:12px;font-weight:900}
.info{height:17mm;display:grid;grid-template-columns:50% 50%;grid-template-rows:10mm 7mm;border-bottom:1px solid #111}.info>.col{overflow:hidden}.info>.col+.col{border-left:1px solid #111}.info .col .cell{height:10mm;min-height:10mm}.invoice-wide{grid-column:1/-1;border-top:1px solid #111;border-bottom:0!important;white-space:nowrap;display:grid;grid-template-columns:1fr 1fr;padding:0!important;min-height:7mm}.invoice-part{display:flex;align-items:center;padding:1mm 1.8mm;min-width:0;white-space:nowrap;overflow:hidden}.invoice-part+.invoice-part{border-left:1.5px solid #111}.cell{padding:1mm 1.8mm;border-bottom:1px solid #111;min-height:8.4mm;line-height:1.15;overflow:hidden;font-size:10px}.cell:last-child{border-bottom:0}.cell b{font-weight:900}.party-name{font-size:13px;font-weight:900}.party-phone{font-size:12px;font-weight:900}.invoice{font-size:11px;font-weight:900}
.bodyrow{height:31mm;display:grid;grid-template-columns:72% 28%;border-bottom:1px solid #111}.goods{overflow:hidden}.goods-head,.goods-row{display:grid;grid-template-columns:22% 38% 40%}.goods-head{height:7mm;font-weight:900;font-size:9px;text-align:center;background:#eef5fb;border-bottom:1px solid #111}.goods-head>div,.goods-row>div{display:flex;align-items:center;justify-content:center;padding:.8mm 1mm;border-right:1px solid #111;overflow:hidden}.goods-head>div:last-child,.goods-row>div:last-child{border-right:0}.goods-row{height:7mm;min-height:7mm;max-height:7mm;font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden}.goods-row>div:nth-child(2),.goods-row>div:nth-child(3){justify-content:flex-start;white-space:nowrap}.goods-fill{height:10mm;border-bottom:1px solid #ddd}.charges{border-left:1px solid #111;overflow:hidden}.charge-row{display:grid;grid-template-columns:60% 40%;min-height:5mm;border-bottom:1px solid #111}.charge-row>div{padding:.7mm 1.2mm;font-weight:900;font-size:10px;line-height:1.05;display:flex;align-items:center}.charge-row>div+div{border-left:1px solid #111;justify-content:flex-end}.charge-total{font-size:12px;font-weight:900;min-height:6mm}.footer{height:16mm;display:grid;grid-template-columns:65% 35%;position:relative}.footer-left{overflow:hidden}.remark{height:7mm;padding:1.2mm 1.5mm;border-bottom:1px solid #111;font-weight:800;white-space:nowrap;overflow:hidden;font-size:8px}.risk{padding:2mm 1.5mm;font-size:7px;font-weight:700;line-height:1.1}.receiver{border-left:1px solid #111;display:flex;align-items:stretch;padding:1.2mm}.receiver-box{width:100%;border:1px solid #111;display:flex;align-items:flex-start;padding:1mm 1.2mm;font-weight:900;font-size:9px}.receiver-box span{font-weight:900}
}
</style></head><body>
<div class="top"><b>SHIVA SHAKTHI ROAD TRANSPORT — ONLINE BILTY / LR</b><div><a href="bilty.html">NRT Bilty</a><a href="shiva-reports.html">Reports</a></div></div>
<div class="wrap"><div class="box" id="home" style="display:none"><h2>SHIVA SHAKTHI ROAD TRANSPORT — Home</h2><p>Welcome to SST Online System</p><button class="blue" onclick="openNewBilty()">＋ New Bilty</button><button class="green" onclick="location.href='shiva-reports.html'">Reports</button><button class="red" onclick="logout()">Logout</button></div><div class="box" id="login"><h2>SHIVA SHAKTHI Staff Login</h2><div class="grid"><div><label>Email</label><input id="email" type="email"></div><div><label>Password</label><input id="password" type="password"></div></div><button class="blue" onclick="doLogin()">Login</button><div id="loginMsg"></div></div>
<div class="box" id="app" style="display:none"><h2>New / Edit Bilty</h2><div class="grid"><div><label>LR Number</label><input id="lr_no" readonly></div><div><label>Date</label><input id="lr_date" type="date"></div><div><label>Freight Type</label><select id="freight_type"><option>TO PAY</option><option>PAID</option><option>ON ACCOUNT</option></select></div><div><label>From</label><input id="from_location" value="HYDERABAD"></div><div><label>To</label><input id="to_location"></div><div><label>Consignor Name</label><input id="consignor_name" list="parties"></div><div><label>Consignor Phone</label><input id="consignor_phone"></div><div><label>Consignee Name</label><input id="consignee_name" list="parties"></div><div><label>Consignee Phone</label><input id="consignee_phone"></div><div><label>Quantity</label><input id="packages" type="number" value="0"></div><div><label>Weight</label><input id="weight" type="number" value="0"></div><div class="full"><label>Goods / Description</label><input id="goods"></div><div><label>Invoice Number</label><input id="invoice_no"></div><div><label>Invoice Value</label><input id="invoice_value" type="number" value="0"></div><div><label>Freight</label><input id="freight" type="number" value="0"></div><div><label>Hamali Charge</label><input id="hamali" type="number" value="0"></div><div><label>LR Charge</label><input id="other_charges" type="number" value="0"></div><div class="full"><label>Remarks</label><textarea id="remarks"></textarea></div></div><datalist id="parties"></datalist><div class="noprint"><button class="blue" onclick="saveLR()">Save Bilty</button><button class="yellow" onclick="printLR()">Print / PDF</button><button onclick="clearForm()">Clear</button><button class="green" onclick="location.href='shiva-reports.html'">Reports</button><button class="red" onclick="logout()">Logout</button><button id="viewEditBtn" class="green" style="display:none" onclick="location.href='shiva-bilty.html?edit='+encodeURIComponent(new URLSearchParams(location.search).get('view'))">Edit</button><button id="viewShareBtn" class="blue" style="display:none" onclick="shareCurrentLR()">Share</button><button id="viewCancelBtn" class="yellow" style="display:none" onclick="cancelCurrentLR()">Cancel LR</button><button id="viewDeleteBtn" class="red" style="display:none" onclick="deleteCurrentLR()">Delete</button></div><div id="msg"></div></div><div id="printArea" class="printarea"></div></div>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₹'+Number(n||0).toLocaleString('en-IN');let editingId=null,viewOnly=false;
async function doLogin(){let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginMsg').textContent=r.error.message;return}show()}
async function logout(){await sb.auth.signOut();location.reload()}
function openNewBilty(){history.replaceState(null,'',location.pathname);$('home').style.display='none';$('app').style.display='block';$('app').querySelector('h2').textContent='New Bilty';$('app').querySelectorAll('input,select,textarea').forEach(el=>el.disabled=false);['viewEditBtn','viewShareBtn','viewCancelBtn','viewDeleteBtn'].forEach(id=>$(id).style.display='none');clearForm()}
async function nextLR(){let r=await sb.from('lrs').select('lr_no').like('lr_no','SST/%').limit(1000);if(r.error)throw r.error;let m=0;(r.data||[]).forEach(x=>{let n=String(x.lr_no||'').match(/^SST\/(\d+)$/);if(n)m=Math.max(m,+n[1])});return 'SST/'+String(m+1).padStart(5,'0')}
async function show(){const u=new URLSearchParams(location.search),mode=u.has('edit')?'edit':u.has('view')?'view':u.has('print')?'print':'';$('login').style.display='none';if(!mode){$('home').style.display='block';$('app').style.display='none';return}$('home').style.display='none';$('app').style.display='block';$('lr_date').value=today();$('lr_no').value=await nextLR();let r=await sb.from('lrs').select('lr_no,consignor_name,consignor_phone,consignee_name,consignee_phone,to_location').like('lr_no','SST/%').limit(5000),p={},a={};(r.data||[]).forEach(x=>{if(x.consignor_name)p[x.consignor_name]=x.consignor_phone||'';if(x.consignee_name){p[x.consignee_name]=x.consignee_phone||'';if(x.to_location)a[x.consignee_name]=x.to_location}});$('parties').innerHTML=Object.keys(p).map(n=>`<option value="${esc(n)}">`).join('');$('consignee_name').addEventListener('change',()=>{let n=$('consignee_name').value,k=Object.keys(p).find(x=>x.toLowerCase()===n.toLowerCase());if(k)$('consignee_phone').value=p[k];let ak=Object.keys(a).find(x=>x.toLowerCase()===n.toLowerCase());if(ak)$('to_location').value=a[ak]});$('consignor_name').addEventListener('change',()=>{let n=$('consignor_name').value,k=Object.keys(p).find(x=>x.toLowerCase()===n.toLowerCase());if(k)$('consignor_phone').value=p[k]});await handleRecordAction()}
async function handleRecordAction(){const u=new URLSearchParams(location.search),mode=u.has('edit')?'edit':u.has('view')?'view':u.has('print')?'print':'';if(!mode)return;const id=u.get(mode);if(!id)return;const {data,error}=await sb.from('lrs').select('*').eq('id',id).like('lr_no','SST/%').single();if(error||!data){$('msg').textContent='LR record not found: '+(error?.message||'');return}editingId=mode==='edit'?data.id:null;const fields=['lr_no','lr_date','from_location','to_location','freight_type','consignor_name','consignor_phone','consignee_name','consignee_phone','packages','weight','goods','invoice_no','invoice_value','freight','hamali','other_charges','remarks'];fields.forEach(k=>{if($(k))$(k).value=data[k]??(['packages','weight','invoice_value','freight','hamali','other_charges'].includes(k)?0:'')});$('lr_no').readOnly=true;$('msg').textContent=mode==='edit'?'Editing '+data.lr_no:mode==='view'?'Viewing '+data.lr_no:'Printing '+data.lr_no;if(mode==='view'){$('app').querySelectorAll('input,select,textarea').forEach(el=>el.disabled=true);$('app').querySelectorAll('.noprint button').forEach(el=>{if(!/Print \/ PDF|Reports|Logout/.test(el.textContent))el.style.display='none'});['viewEditBtn','viewShareBtn','viewCancelBtn','viewDeleteBtn'].forEach(id=>$(id).style.display='inline-block');$('app').querySelector('h2').textContent='View Bilty'}if(mode==='print'){renderPrint(data);setTimeout(()=>window.print(),350)}}
function currentViewId(){return new URLSearchParams(location.search).get('view')}
async function getCurrentLR(){const id=currentViewId();if(!id)return null;const r=await sb.from('lrs').select('*').eq('id',id).like('lr_no','SST/%').single();if(r.error){alert('LR load failed: '+r.error.message);return null}return r.data}
async function shareCurrentLR(){const x=await getCurrentLR();if(!x)return;const txt=`SHIVA SHAKTHI ROAD TRANSPORT\nLR No: ${x.lr_no||''}\nDate: ${x.lr_date||''}\nFrom: ${x.from_location||''}\nTo: ${x.to_location||''}\nConsignor: ${x.consignor_name||''}\nConsignee: ${x.consignee_name||''}\nQuantity: ${x.packages||0}\nFreight: ${money(x.freight)}\nLR Charge: ${money(x.other_charges)}\nTotal: ${money((Number(x.freight)||0)+(Number(x.hamali)||0)+(Number(x.other_charges)||0))}`;if(navigator.share){try{await navigator.share({title:'SST LR '+x.lr_no,text:txt})}catch(e){}}else location.href='https://wa.me/?text='+encodeURIComponent(txt)}
async function cancelCurrentLR(){const x=await getCurrentLR();if(!x)return;if(!confirm('Cancel '+x.lr_no+'? The LR will remain in Reports.'))return;const r=await sb.from('lrs').update({status:'Cancelled'}).eq('id',x.id).like('lr_no','SST/%');if(r.error){alert('Cancel failed: '+r.error.message);return}alert(x.lr_no+' cancelled.');location.href='shiva-reports.html'}
async function deleteCurrentLR(){const x=await getCurrentLR();if(!x)return;if(!confirm('Delete '+x.lr_no+' permanently? This cannot be undone.'))return;const r=await sb.from('lrs').delete().eq('id',x.id).like('lr_no','SST/%');if(r.error){alert('Delete failed: '+r.error.message);return}location.href='shiva-reports.html'}
function row(){return{lr_no:$('lr_no').value,lr_date:$('lr_date').value,from_location:$('from_location').value,to_location:$('to_location').value,freight_type:$('freight_type').value,consignor_name:$('consignor_name').value,consignor_phone:$('consignor_phone').value,consignee_name:$('consignee_name').value,consignee_phone:$('consignee_phone').value,packages:+$('packages').value||0,weight:+$('weight').value||0,goods:$('goods').value,invoice_no:$('invoice_no').value,invoice_value:+$('invoice_value').value||0,freight:+$('freight').value||0,hamali:+$('hamali').value||0,other_charges:+$('other_charges').value||0,remarks:$('remarks').value,status:'Booked'}}
async function saveLR(){let x=row();if(editingId){let r=await sb.from('lrs').update(x).eq('id',editingId);if(r.error){$('msg').textContent=r.error.message;return}$('msg').textContent=x.lr_no+' updated successfully';renderPrint(x);window.print();return}let r=await sb.from('lrs').insert(x);if(r.error){$('msg').textContent=r.error.message;return}$('msg').textContent=x.lr_no+' saved successfully';printLR();setTimeout(async()=>$('lr_no').value=await nextLR(),500)}
function clearForm(){editingId=null;['to_location','consignor_name','consignor_phone','consignee_name','consignee_phone','goods','invoice_no','remarks'].forEach(i=>$(i).value='');['packages','weight','invoice_value','freight','hamali','other_charges'].forEach(i=>$(i).value=0);$('lr_date').value=today();nextLR().then(x=>$('lr_no').value=x)}
function printLR(){renderPrint(row());window.print()}function printRecord(r){renderPrint(r);window.print()}
function formatDMY(v){const s=String(v||'');const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}-${m[2]}-${m[1]}`:s}function renderPrint(r){const copies=['CONSIGNOR COPY','CONSIGNEE COPY','TRANSPORT COPY'];const total=Number(r.freight||0)+Number(r.hamali||0)+Number(r.other_charges||0);$('printArea').innerHTML=`<div class="sheet">${copies.map(c=>`<div class="copy">
<div class="copy-header"><div class="brand"><div class="company">SHIVA SHAKTHI ROAD TRANSPORT</div><div class="address">Plot No. 1, Block No. 3, Autonagar, Hyderabad, Telangana - 500070</div><div class="gst">Mobile : 9885410410 / 9989581732</div><div class="service">ONE DAY DELIVERY SERVICE</div></div><div class="copy-side"><div class="side-top"><div class="gstbox">GST No : 36HSYPK0996J1ZM</div><div class="copy-label">${c}</div></div><div class="lrbox"><div>LR No :&nbsp;<b>${esc(r.lr_no)}</b></div><div>Date :&nbsp;<b>${esc(formatDMY(r.lr_date))}</b></div></div></div></div>
<div class="meta2"><div><b>From :</b>&nbsp; ${esc(r.from_location)}</div><div><b>To :</b>&nbsp; ${esc(r.to_location)}</div><div class="freight-type"><b>Freight Type :&nbsp; ${esc(r.freight_type||'TO PAY')}</b></div></div>
<div class="info"><div class="col"><div class="cell"><b>Consignor :</b> <span class="party-name">${esc(r.consignor_name||'-')}</span><br><b>Mobile :</b> <span class="party-phone">${esc(r.consignor_phone||'-')}</span></div></div><div class="col"><div class="cell"><b>Consignee :</b> <span class="party-name">${esc(r.consignee_name||'-')}</span><br><b>Mobile :</b> <span class="party-phone">${esc(r.consignee_phone||'-')}</span></div></div><div class="cell invoice invoice-wide"><div class="invoice-part"><b>Invoice Number :&nbsp;</b>${esc(r.invoice_no||'-')}</div><div class="invoice-part"><b>Invoice Value :&nbsp;</b>${money(r.invoice_value)}</div></div></div>
<div class="bodyrow"><div class="goods"><div class="goods-head"><div>QUANTITY</div><div>DESCRIPTION</div><div>REMARKS</div></div><div class="goods-row"><div>${esc(r.packages??'0')}</div><div>${esc(r.goods||'-')}</div><div>${esc(r.remarks||'-')}</div></div><div class="goods-fill"></div></div><div class="charges"><div class="charge-row"><div>Freight</div><div>${money(r.freight)}</div></div><div class="charge-row"><div>Hamali</div><div>${money(r.hamali)}</div></div><div class="charge-row"><div>LR Charge</div><div>${money(r.other_charges)}</div></div><div class="charge-row charge-total"><div>Total Amount</div><div>${money(total)}</div></div></div></div>
<div class="footer"><div class="footer-left"><div class="risk">Goods booked at owner's risk and said to contain basis. &nbsp; Non Negotiable</div></div><div class="receiver"><div class="receiver-box"><span>Receiver's Sign :</span></div></div></div></div>`).join('')}</div>`}
window.addEventListener('load',async()=>{let s=await sb.auth.getSession();if(s.data.session)show()});
</script></body></html>
