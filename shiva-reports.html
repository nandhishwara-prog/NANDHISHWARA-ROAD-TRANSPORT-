<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIVA SHAKTHI Reports</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{font:14px Arial;background:#f3f6fa;margin:0}.top{background:#073b8f;color:white;padding:14px}.top a{color:white;margin-right:14px}.wrap{max-width:1200px;margin:18px auto;padding:10px}.box{background:white;padding:14px;border-radius:8px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px}input{padding:10px;width:100%;border:1px solid #bbb;border-radius:5px}button{padding:9px 12px;border:0;border-radius:5px;margin:4px;font-weight:bold}.blue{background:#0756a6;color:white}.yellow{background:#ffd21f}.red{background:#b91c1c;color:white}.green{background:#16803c;color:white}.gray{background:#6b7280;color:white}.stats{display:flex;gap:18px;flex-wrap:wrap}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}td,th{border:1px solid #ccc;padding:7px;font-size:12px;text-align:left}th{background:#eaf2fb}@media(max-width:650px){.grid{grid-template-columns:1fr}}@media print{@page{size:A4 landscape;margin:10mm}.top,.filters,.actions,td:last-child,th:last-child{display:none!important}.wrap{margin:0;padding:0}td,th{font-size:8pt}}</style></head><body><div class="top"><b>SHIVA SHAKTHI ROAD TRANSPORT — REPORTS</b><div><a href="shiva-bilty.html">New Bilty</a><a href="bilty.html">NRT Bilty</a><button onclick="logout()">Logout</button></div></div><div class="wrap"><div class="box filters"><h2>LR Reports</h2><div class="grid"><div><label>From Date</label><input id="f" type="date"></div><div><label>To Date</label><input id="t" type="date"></div><div><label>Search LR / Name / From / To</label><input id="q" placeholder="Search..." type="search"></div></div><div class="actions"><button class="blue" onclick="render()">Search</button><button class="gray" onclick="clearF()">Clear</button><button class="yellow" onclick="window.print()">Print Sheet</button><button class="red" onclick="window.print()">PDF Print</button><button class="green" onclick="excel()">Excel Sheet</button></div><div id="msg"></div></div><div class="box"><div class="stats"><b id="count">0 LRs</b><b id="packages">0 packages</b><b id="weight">0 weight</b><b id="freight">₹0 freight</b><b id="total">₹0 total</b></div></div><div class="box tablewrap"><table><thead><tr><th>LR No</th><th>Date</th><th>From</th><th>To</th><th>Consignor</th><th>Consignee</th><th>Packages</th><th>Weight</th><th>Freight</th><th>LR Charge</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=id=>document.getElementById(id);let data=[],view=[];const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),money=n=>'₹'+Number(n||0).toLocaleString('en-IN');async function logout(){await sb.auth.signOut();location.href='shiva-bilty.html'}async function load(){let s=await sb.auth.getSession();if(!s.data.session){$('msg').textContent='Please login from SHIVA SHAKTHI Bilty.';return}let all=[],size=500;for(let i=0;;i+=size){let r=await sb.from('lrs').select('*').like('lr_no','SST/%').range(i,i+size-1);if(r.error){$('msg').textContent=r.error.message;return}all=all.concat(r.data||[]);if(!r.data||r.data.length<size)break}data=all;render()}function render(){let f=$('f').value,t=$('t').value,q=$('q').value.toLowerCase().trim();view=data.filter(x=>(!f||x.lr_date>=f)&&(!t||x.lr_date<=t)&&(!q||[x.lr_no,x.consignor_name,x.consignee_name,x.from_location,x.to_location].some(v=>String(v||'').toLowerCase().includes(q))));let p=0,w=0,fr=0,ex=0;$('rows').innerHTML=view.map((x,i)=>{p+=+x.packages||0;w+=+x.weight||0;fr+=+x.freight||0;ex+=(+x.other_charges||0)+(+x.hamali||0);return `<tr><td>${esc(x.lr_no)}</td><td>${esc(x.lr_date)}</td><td>${esc(x.from_location)}</td><td>${esc(x.to_location)}</td><td>${esc(x.consignor_name)}</td><td>${esc(x.consignee_name)}</td><td>${+x.packages||0}</td><td>${+x.weight||0}</td><td>${money(x.freight)}</td><td>${money(x.other_charges)}</td><td><button class="red" onclick="del(${i})">Delete</button></td></tr>`}).join('');$('count').textContent=view.length+' LRs';$('packages').textContent=p+' packages';$('weight').textContent=w+' weight';$('freight').textContent=money(fr);$('total').textContent=money(fr+ex);$('msg').textContent=view.length+' SHIVA SHAKTHI records loaded.'}function clearF(){$('f').value='';$('t').value='';$('q').value='';render()}function excel(){if(!view.length){alert('No records');return}let h='<html><head><meta charset="utf-8"></head><body><h2>SHIVA SHAKTHI ROAD TRANSPORT</h2><table border="1"><tr><th>LR No</th><th>Date</th><th>From</th><th>To</th><th>Consignor</th><th>Consignee</th><th>Packages</th><th>Weight</th><th>Freight</th><th>LR Charge</th></tr>'+view.map(x=>'<tr>'+[x.lr_no,x.lr_date,x.from_location,x.to_location,x.consignor_name,x.consignee_name,x.packages,x.weight,x.freight,x.other_charges].map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table></body></html>';let a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff',h],{type:'application/vnd.ms-excel'}));a.href=u;a.download='SHIVA_SHAKTHI_LR_Report.xls';a.click();URL.revokeObjectURL(u)}async function del(i){let x=view[i];if(!confirm('Delete '+x.lr_no+'?'))return;let r=await sb.from('lrs').delete().eq('id',x.id);if(r.error)alert(r.error.message);else load()}$('q').addEventListener('input',render);['f','t'].forEach(id=>$(id).addEventListener('change',render));window.addEventListener('load',load);
</script></body></html>
