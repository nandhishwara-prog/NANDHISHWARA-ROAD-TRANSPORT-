<script>
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),editingId=null,currentLR=null;

const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);

function msg(t){$('msg').textContent=t}

function esc(x){
return String(x??'').replace(/[&<>"]/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;'
}[m]))
}

function money(x){
return '₹'+Number(x||0).toLocaleString('en-IN')
}

async function login(){
let{error}=await sb.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});
if(error){$('loginMsg').textContent=error.message;return}
location.href='nrt-home.html'
}

async function logout(){
await sb.auth.signOut();
location.reload()
}

async function nextLR(){
  const pageSize = 1000;
  let offset = 0;
  let max = 0;

  while(true){
    const {data,error} = await sb
      .from('lrs')
      .select('lr_no')
      .like('lr_no','NRT/%')
      .range(offset, offset + pageSize - 1);

    if(error) throw error;

    (data || []).forEach(x => {
      const m = String(x.lr_no || '')
        .match(/^NRT\/(\d+)$/);

      if(m) max = Math.max(max, Number(m[1]));
    });

    if(!data || data.length < pageSize) break;
    offset += pageSize;
  }

  return 'NRT/' + (max ? max + 1 : 45243);
}


async function showApp(){
$('loginBox').style.display='none';
$('app').style.display='block';
$('lr_date').value=today();
$('from_location').value='HYDERABAD';
$('lr_no').value=await nextLR();
loadParties()
}

async function loadParties(){
  let{data,error}=await sb.from('lrs')
    .select('consignor_name,consignor_phone,consignor_gstin,consignee_name,consignee_phone,consignee_gstin,to_location,lr_date')
    .order('lr_date',{ascending:false})
    .limit(5000);

  if(error)return;

  const parties={};
  const partyGSTINs={};
  const consigneeAddresses={};

  (data||[]).forEach(r=>{
    const cn=String(r.consignor_name||'').trim();
    const cp=String(r.consignor_phone||'').trim();
    const en=String(r.consignee_name||'').trim();
    const ep=String(r.consignee_phone||'').trim();

    if(cn){parties[cn]=cp;if(r.consignor_gstin)partyGSTINs[cn]=String(r.consignor_gstin).trim().toUpperCase();}
    if(en){parties[en]=ep;if(r.consignee_gstin)partyGSTINs[en]=String(r.consignee_gstin).trim().toUpperCase();}
    const addr=String(r.to_location||'').trim();
    if(en && addr && !consigneeAddresses[en])consigneeAddresses[en]=addr;
  });

  // Keep one combined customer/party list for both Consignor and Consignee.
  $('partyNames').innerHTML=Object.keys(parties)
    .sort((a,b)=>a.localeCompare(b))
    .map(n=>`<option value="${esc(n)}">`)
    .join('');

  function autoPhone(nameId,phoneId){
    const name=$(nameId).value.trim();
    if(!name)return;

    // Exact match first.
    if(parties[name]!==undefined){
      $(phoneId).value=parties[name]||'';
      return;
    }

    // Case-insensitive match as a fallback.
    const key=Object.keys(parties).find(n=>n.toLowerCase()===name.toLowerCase());
    if(key)$(phoneId).value=parties[key]||'';
  }

  function autoGSTIN(nameId,gstinId){
    const name=$(nameId).value.trim();
    if(!name){$(gstinId).value='';return;}
    const key=Object.keys(partyGSTINs).find(n=>n.toLowerCase()===name.toLowerCase());
    let localGST={};
    try{localGST=JSON.parse(localStorage.getItem('nrt_party_gstins')||'{}')}catch(e){}
    const localKey=Object.keys(localGST).find(n=>n.toLowerCase()===name.toLowerCase());
    const gst=(key && partyGSTINs[key]) || (localKey && localGST[localKey]) || '';
    $(gstinId).value=gst;
  }

  // Selecting/typing a previously used name automatically fills its phone.
  ['input','change'].forEach(ev=>{
    $('consignor_name').addEventListener(ev,()=>autoPhone('consignor_name','consignor_phone'));
    $('consignee_name').addEventListener(ev,()=>autoPhone('consignee_name','consignee_phone'));
  });

  function autoToAddress(){
    const name=$('consignee_name').value.trim();
    if(!name)return;
    const key=Object.keys(consigneeAddresses).find(n=>n.toLowerCase()===name.toLowerCase());
    if(key && consigneeAddresses[key])$('to_location').value=consigneeAddresses[key];
    let localAddresses={};
    try{localAddresses=JSON.parse(localStorage.getItem('nrt_consignee_addresses')||'{}')}catch(e){}
    const localKey=Object.keys(localAddresses).find(n=>n.toLowerCase()===name.toLowerCase());
    if(localKey && localAddresses[localKey])$('to_location').value=localAddresses[localKey];
  }
  ['input','change'].forEach(ev=>$('consignee_name').addEventListener(ev,autoToAddress));

  // Also save the phone in the local browser for instant suggestions/autofill
  // even before a new record has been reloaded from the database.
  function rememberParty(nameId,phoneId){
    const name=$(nameId).value.trim();
    const phone=$(phoneId).value.trim();
    if(!name)return;

    let saved={};
    try{saved=JSON.parse(localStorage.getItem('nrt_parties')||'{}')}catch(e){}
    saved[name]=phone;
    localStorage.setItem('nrt_parties',JSON.stringify(saved));
  }

  function autoLocal(nameId,phoneId){
    const name=$(nameId).value.trim();
    if(!name)return;
    let saved={};
    try{saved=JSON.parse(localStorage.getItem('nrt_parties')||'{}')}catch(e){}
    if(saved[name] && !$(phoneId).value.trim())$(phoneId).value=saved[name];
  }

  ['input','change'].forEach(ev=>{
    $('consignor_name').addEventListener(ev,()=>autoLocal('consignor_name','consignor_phone'));
    $('consignee_name').addEventListener(ev,()=>autoLocal('consignee_name','consignee_phone'));
  });

  ['input','change'].forEach(ev=>{
    $('consignor_name').addEventListener(ev,()=>autoGSTIN('consignor_name','consignor_gstin'));
    $('consignee_name').addEventListener(ev,()=>autoGSTIN('consignee_name','consignee_gstin'));
  });

  $('consignor_phone').addEventListener('change',()=>rememberParty('consignor_name','consignor_phone'));
  $('consignee_phone').addEventListener('change',()=>rememberParty('consignee_name','consignee_phone'));

  // Load locally remembered parties into the datalist too.
  let local={};
  try{local=JSON.parse(localStorage.getItem('nrt_parties')||'{}')}catch(e){}
  Object.keys(local).forEach(n=>{
    if(!parties[n])parties[n]=local[n];
  });

  $('partyNames').innerHTML=Object.keys(parties)
    .sort((a,b)=>a.localeCompare(b))
    .map(n=>`<option value="${esc(n)}">`)
    .join('');
}

function row(){
return{
lr_no:$('lr_no').value,
lr_date:$('lr_date').value,
from_location:$('from_location').value,
to_location:$('to_location').value,
freight_type:$('freight_type').value,
consignor_name:$('consignor_name').value,
consignor_phone:$('consignor_phone').value,
consignor_gstin:$('consignor_gstin').value.trim().toUpperCase(),
consignee_name:$('consignee_name').value,
consignee_phone:$('consignee_phone').value,
consignee_gstin:$('consignee_gstin').value.trim().toUpperCase(),
packages:+$('packages').value||0,
weight:+$('weight').value||0,
goods:$('goods').value,
invoice_no:$('invoice_no').value,
ewaybill_no:$('ewaybill_no').value.trim(),
invoice_value:+$('invoice_value').value||0,
freight:+$('freight').value||0,
hamali:+$('hamali').value||0,
other_charges:+$('other_charges').value||0,
remarks:$('remarks').value,
status:(currentLR && editingId && currentLR.status ? currentLR.status : 'Booked')
}
}

async function saveLR(){
let r=row();
let q=editingId?
sb.from('lrs').update(r).eq('id',editingId):
sb.from('lrs').insert(r);

let{error}=await q;
if(error){msg(error.message);return}

msg(`${r.lr_no} saved successfully.`);
try{
  const savedGST=JSON.parse(localStorage.getItem('nrt_party_gstins')||'{}');
  if(r.consignor_name && r.consignor_gstin)savedGST[r.consignor_name.trim()]=r.consignor_gstin.trim().toUpperCase();
  if(r.consignee_name && r.consignee_gstin)savedGST[r.consignee_name.trim()]=r.consignee_gstin.trim().toUpperCase();
  localStorage.setItem('nrt_party_gstins',JSON.stringify(savedGST));
}catch(e){}
try{
  const savedAddresses=JSON.parse(localStorage.getItem('nrt_consignee_addresses')||'{}');
  if(r.consignee_name && r.to_location)savedAddresses[r.consignee_name.trim()]=r.to_location.trim();
  localStorage.setItem('nrt_consignee_addresses',JSON.stringify(savedAddresses));
}catch(e){}
editingId=null;currentLR=null;
printLR();

setTimeout(async()=>{
$('lr_no').value=await nextLR()
},300)
}

function clearForm(){
editingId=null;
$('lr_date').value=today();
$('from_location').value='HYDERABAD';

['to_location','consignor_name','consignor_phone',
'consignee_name','consignee_phone','consignor_gstin','consignee_gstin','goods','invoice_no','ewaybill_no','remarks']
.forEach(id=>$(id).value='');

['packages','weight','invoice_value','freight','hamali']
.forEach(id=>$(id).value=0);
$('other_charges').value=20;

nextLR().then(x=>$('lr_no').value=x)
}

async function loadLR(id){
const {data,error}=await sb.from('lrs').select('*').eq('id',id).single();
if(error){alert('LR data load failed: '+error.message);return null}
if(!data){alert('LR record not found');return null}
return data
}

function fillForm(r){
const f={lr_no:r.lr_no||'',lr_date:r.lr_date||'',freight_type:r.freight_type||'TO PAY',from_location:r.from_location||'',to_location:r.to_location||'',consignor_name:r.consignor_name||'',consignor_phone:r.consignor_phone||'',consignor_gstin:r.consignor_gstin||'',consignee_name:r.consignee_name||'',consignee_phone:r.consignee_phone||'',consignee_gstin:r.consignee_gstin||'',packages:r.packages||0,weight:r.weight||0,goods:r.goods||'',invoice_no:r.invoice_no||'',ewaybill_no:r.ewaybill_no||'',invoice_value:r.invoice_value||0,freight:r.freight||0,hamali:r.hamali||0,other_charges:r.other_charges||0,remarks:r.remarks||''};
Object.keys(f).forEach(k=>{if($(k))$(k).value=f[k]})
}

function setFormReadOnly(on){
document.querySelectorAll('#app input,#app select,#app textarea').forEach(e=>e.disabled=on);
document.querySelectorAll('#app .actions button').forEach(b=>b.style.display=on?'none':'');
}

function detailsMarkup(r){
 const total=(+r.freight||0)+(+r.hamali||0)+(+r.other_charges||0);
 const fields=[['LR Number',r.lr_no],['Date',formatPrintDate(r.lr_date)],['Status',String(r.status||'Booked').toUpperCase()],['Freight Type',r.freight_type],['From',r.from_location],['To',r.to_location],['Consignor Name',r.consignor_name],['Consignor Phone',r.consignor_phone],['Consignor GSTIN',r.consignor_gstin],['Consignee Name',r.consignee_name],['Consignee Phone',r.consignee_phone],['Consignee GSTIN',r.consignee_gstin],['Quantity / Packages',r.packages],['Weight',r.weight],['Goods / Description',r.goods],['Invoice Number',r.invoice_no],['E-Waybill Number',r.ewaybill_no],['Invoice Value',money(r.invoice_value)],['Freight',money(r.freight)],['Hamali Charge',money(r.hamali)],['LR Charge',money(r.other_charges)],['Total Amount',money(total)],['Remarks',r.remarks]];
 return `<h2 class="title">LR Details — ${esc(r.lr_no||'')}</h2><div class="grid">${fields.map(([k,v])=>`<div><label>${esc(k)}</label><div style="padding:9px;border:1px solid #d5dbe3;border-radius:7px;background:#fff;min-height:36px;overflow-wrap:anywhere">${esc(v==null||v===''?'-':v)}</div></div>`).join('')}</div><div class="actions"><button class="yellow" onclick="detailPrint()">Print</button><button class="blue" onclick="detailEdit()">Edit</button><button class="blue" onclick="detailShare()">Share</button><button class="gray" onclick="detailCancel()">Cancel LR</button><button class="red" onclick="detailDelete()">Delete</button><button class="gray" onclick="location.href='reports.html'">Back to Reports</button></div><div id="detailMsg" class="msg"></div>`;
}
async function openRequestedLR(mode,id){
 const r=await loadLR(id);if(!r)return;
 $('loginBox').style.display='none';$('app').style.display='none';$('detailsView').style.display='none';
 currentLR=r;editingId=r.id;
 if(mode==='view'){$('detailsView').innerHTML=detailsMarkup(r);$('detailsView').style.display='block';}
 else {$('app').style.display='block';fillForm(r);setFormReadOnly(false);}
}
function detailPrint(){if(currentLR)location.href='bilty.html?print='+encodeURIComponent(currentLR.id)+'&v='+Date.now()}
function detailEdit(){if(currentLR)location.href='bilty.html?edit='+encodeURIComponent(currentLR.id)+'&v='+Date.now()}
async function detailShare(){if(!currentLR)return;const r=currentLR;const text=`NANDHISHWARA ROAD TRANSPORT\nLR No: ${r.lr_no||''}\nDate: ${r.lr_date||''}\nFrom: ${r.from_location||''}\nTo: ${r.to_location||''}\nConsignor: ${r.consignor_name||''}\nConsignee: ${r.consignee_name||''}\nPackages: ${r.packages||0}\nFreight: ${money(r.freight)}\nLR Charge: ${money(r.other_charges)}\nTotal: ${money((+r.freight||0)+(+r.hamali||0)+(+r.other_charges||0))}`;if(navigator.share){try{await navigator.share({title:'LR '+r.lr_no,text})}catch(e){}}else location.href='https://wa.me/?text='+encodeURIComponent(text)}
async function detailCancel(){if(!currentLR)return;if(!confirm('Cancel LR '+currentLR.lr_no+'? It will remain in Reports.'))return;const {data,error}=await sb.from('lrs').update({status:'Cancelled'}).eq('id',currentLR.id).select('*').single();if(error){alert('Cancel failed: '+error.message);return}currentLR=data;$('detailsView').innerHTML=detailsMarkup(data);$('detailsView').style.display='block';}
async function detailDelete(){if(!currentLR)return;if(!confirm('Delete LR '+currentLR.lr_no+'? This cannot be undone.'))return;const {error}=await sb.from('lrs').delete().eq('id',currentLR.id);if(error){alert('Delete failed: '+error.message);return}location.href='reports.html';}


function formatPrintDate(v){
  if(!v)return '';
  const a=String(v).split('-');
  if(a.length===3 && a[0].length===4) return a[2]+'/'+a[1]+'/'+a[0];
  return v;
}

const params=new URLSearchParams(window.location.search);
const printId=params.get('print');

let r;

if(printId){

r=await loadLR(printId);
if(!r)return;

}else{

r=row();

let total=Number(r.freight||0)+Number(r.hamali||0)+Number(r.other_charges||0);
let copies=['CONSIGNOR COPY','CONSIGNEE COPY','TRANSPORT COPY'];

<div class="footer"><div class="footer-left"><div class="remark"><b>E-Waybill No(s):</b> ${esc(r.ewaybill_no||'-')}</div><div class="risk">Goods booked at owner's risk and said to contain basis. &nbsp; Non Negotiable</div></div><div class="receiver"><div class="receiver-box"><span>Receiver's Sign :</span></div></div></div></div>`).join('')+'</div>';

window.addEventListener('load',async()=>{

let{data:{session}}=await sb.auth.getSession();

const params=new URLSearchParams(window.location.search);
if(!session)return;
// Open the New Bilty form when a logged-in user visits bilty.html directly.
// Keep print/view/edit routes unchanged.
const printId=params.get('print');
const viewId=params.get('view');
const editId=params.get('edit');

if(printId){

$('loginBox').style.display='none';
$('app').style.display='none';
await printLR();

}else if(viewId){

await openRequestedLR('view',viewId);

}else if(editId){

await openRequestedLR('edit',editId);

}else{

showApp();

}

});
</script>
