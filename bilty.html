<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NRT LR PDF - A4 3 Copies</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee;font-family:Arial,sans-serif;color:#111}
.page{width:210mm;height:297mm;background:#fff;margin:10px auto;padding:5mm;display:flex;flex-direction:column;gap:2mm}
.copy{height:95mm;border:1px solid #111;overflow:hidden;font-size:8px}
.header{height:20mm;display:grid;grid-template-columns:72% 28%;border-bottom:1px solid #111}
.brand{padding:2mm}.company{font-size:15px;font-weight:900}.address{font-size:8px;font-weight:700;margin-top:1mm}
.phone{font-size:8px;font-weight:900;margin-top:1mm}.service{font-size:8px;font-weight:900;margin-top:1mm}
.right{border-left:1px solid #111}.toprow{height:8mm;display:grid;grid-template-columns:68% 32%;border-bottom:1px solid #111}
.gst,.copyname{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:8px}
.copyname{border-left:1px solid #111;text-align:center}
.lrrow{height:12mm;display:grid;grid-template-columns:1fr 1fr;font-weight:900}
.lrrow div{display:flex;align-items:center;justify-content:center}
.lrrow div+div{border-left:1px solid #111}
.meta{height:8mm;display:grid;grid-template-columns:30% 42% 28%;border-bottom:1px solid #111}
.meta div{padding:1.5mm;font-weight:800;border-right:1px solid #111}.meta div:last-child{border:0}
.info{height:18mm;display:grid;grid-template-columns:39% 36% 25%;border-bottom:1px solid #111}
.info .col+.col{border-left:1px solid #111}
.cell{padding:1.2mm;border-bottom:1px solid #111;min-height:7mm}
.cell:last-child{border:0}
.party{font-size:9px;font-weight:900}
.body{height:32mm;display:grid;grid-template-columns:72% 28%;border-bottom:1px solid #111}
.items-head,.items-row{display:grid;grid-template-columns:11% 31% 10% 48%}
.items-head{height:6mm;background:#eee;font-weight:900}
.items-head div,.items-row div{padding:1mm;border-right:1px solid #111;display:flex;align-items:center;justify-content:center}
.items-row{min-height:6mm}.items-row div:nth-child(2),.items-row div:nth-child(4){justify-content:flex-start}
.charges{border-left:1px solid #111}
.charge{display:grid;grid-template-columns:62% 38%;min-height:4.5mm;border-bottom:1px solid #111;font-weight:800}
.charge div{padding:.7mm 1mm}.charge div+div{border-left:1px solid #111;text-align:right}
.total{font-weight:900}
.footer{height:16mm;display:grid;grid-template-columns:65% 35%}
.remarks{padding:1.5mm}.sign{border-left:1px solid #111;padding:1.5mm}.signbox{border:1px solid #111;height:100%;padding:1.5mm;font-weight:900}
input{border:0;border-bottom:1px solid #888;padding:2px;font-size:13px;width:100%}
.controls{width:210mm;margin:10px auto;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;background:#fff;padding:12px}
.controls label{font-weight:700}.controls input{border:1px solid #aaa}
@media print{
 body{background:#fff}
 .controls{display:none}
 .page{margin:0;padding:5mm;width:210mm;height:297mm}
}
</style>
</head>
<body>

<div class="controls">
<label>LR No.<input id="lr" value="NRT/45316"></label>
<label>Date<input id="date" type="date"></label>
<label>From<input id="from" value="HYDERABAD"></label>
<label>To<input id="to" value=""></label>
<label>Freight Type<input id="ft" value="TO PAY"></label>
<label>Consignor<input id="consignor" value=""></label>
<label>Consignor Phone<input id="cphone" value=""></label>
<label>Consignee<input id="consignee" value=""></label>
<label>Consignee Phone<input id="dphone" value=""></label>
<label>Qty<input id="qty" value="0"></label>
<label>Packing<input id="packing" value="BOX"></label>
<label>Invoice No.<input id="inv" value=""></label>
<label>Invoice Value<input id="invvalue" value="0"></label>
<label>Description<input id="desc" value=""></label>
<label>Freight<input id="freight" value="0"></label>
<label>Hamali<input id="hamali" value="0"></label>
<label>LR Charge<input id="lrcharge" value="0"></label>
<label>Remarks<input id="remarks" value=""></label>
<button onclick="window.print()" style="grid-column:1/-1;padding:12px;font-weight:900">PRINT / SAVE PDF</button>
</div>

<div class="page" id="page"></div>

<script>
const $=id=>document.getElementById(id);
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN');
function copy(title){
 const total=(+$('freight').value||0)+(+$('hamali').value||0)+(+$('lrcharge').value||0);
 return `<div class="copy">
 <div class="header">
  <div class="brand">
   <div class="company">NANDHISHWARA ROAD TRANSPORT</div>
   <div class="address">Plot No. 1, Block No. 8, Autonagar, Hyderabad, Telangana - 500070</div>
   <div class="phone">Mobile : 9885410410 / 9989581732</div>
   <div class="service">ONE DAY DELIVERY SERVICE</div>
  </div>
  <div class="right">
   <div class="toprow"><div class="gst">GST No : 36HSYPK0996J1ZM</div><div class="copyname">${title}</div></div>
   <div class="lrrow"><div>LR No : <b>${$('lr').value}</b></div><div>Date : <b>${$('date').value}</b></div></div>
  </div>
 </div>
 <div class="meta"><div>From : <b>${$('from').value}</b></div><div>To : <b>${$('to').value}</b></div><div>Freight Type : <b>${$('ft').value}</b></div></div>
 <div class="info">
  <div class="col">
   <div class="cell"><b>Consignor :</b> <span class="party">${$('consignor').value}</span><br><b>Mobile :</b> <span class="party">${$('cphone').value}</span></div>
   <div class="cell"><b>Qty :</b> <b>${$('qty').value}</b> &nbsp; <b>Packing :</b> <b>${$('packing').value}</b></div>
  </div>
  <div class="col">
   <div class="cell"><b>Consignee :</b> <span class="party">${$('consignee').value}</span><br><b>Mobile :</b> <span class="party">${$('dphone').value}</span></div>
   <div class="cell"><b>INV :</b> <b>${$('inv').value}</b> &nbsp; <b>VALUE :</b> <b>${money($('invvalue').value)}</b></div>
  </div>
  <div class="col"><div class="cell"><b>Qty / Packing</b><br><b>${$('qty').value} / ${$('packing').value}</b></div></div>
 </div>
 <div class="body">
  <div>
   <div class="items-head"><div>S.No.</div><div>Description</div><div>Qty.</div><div>Goods / Remarks</div></div>
   <div class="items-row"><div>1</div><div><b>${$('desc').value}</b></div><div><b>${$('qty').value}</b></div><div>${$('remarks').value}</div></div>
  </div>
  <div class="charges">
   <div class="charge"><div>Freight</div><div>${money($('freight').value)}</div></div>
   <div class="charge"><div>Hamali</div><div>${money($('hamali').value)}</div></div>
   <div class="charge"><div>LR CHARGE</div><div>${money($('lrcharge').value)}</div></div>
   <div class="charge total"><div>Total</div><div>${money(total)}</div></div>
  </div>
 </div>
 <div class="footer"><div class="remarks"><b>Remarks :</b> ${$('remarks').value}</div><div class="sign"><div class="signbox">Receiver's Sign :</div></div></div>
 </div>`;
}
function render(){ $('page').innerHTML=copy('CONSIGNOR COPY')+copy('CONSIGNEE COPY')+copy('TRANSPORT COPY'); }
$('date').value=new Date().toISOString().slice(0,10);
document.querySelectorAll('input').forEach(x=>x.addEventListener('input',render));
render();
</script>
</body>
</html>
