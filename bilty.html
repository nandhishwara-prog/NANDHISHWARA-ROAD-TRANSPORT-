<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NRT Online Bilty / LR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033}.top{background:#0c4d96;color:#fff;padding:15px}.topin{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none}.wrap{max-width:1150px;margin:auto;padding:20px}.box{background:#fff;border:1px solid #e1e7ef;border-radius:14px;padding:20px;margin-bottom:18px}.title{color:#1257a6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#536177;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cfd7e3;border-radius:8px;font-size:14px}textarea{min-height:70px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}button{border:0;border-radius:9px;padding:12px 17px;font-weight:800;cursor:pointer}.blue{background:#1257a6;color:white}.yellow{background:#ffd21c;color:#15396b}.gray{background:#e8edf4}.danger{background:#c62828;color:#fff}.msg{margin-top:10px;font-weight:700}.search{display:flex;gap:8px}.search input{flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e5eaf1;text-align:left;white-space:nowrap}.badge{padding:5px 8px;border-radius:12px;background:#eaf3ff;color:#1257a6;font-weight:800}.printarea{display:none}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px}.topin{gap:8px}.search{flex-direction:column}}
@media print{
@page{size:A4 portrait !important;margin:0 !important}html,body{width:210mm;min-height:297mm;margin:0!important;padding:0!important;background:#fff}.top,.wrap>*:not(#printArea){display:none!important}.printarea{display:block!important;width:210mm!important}.sheet{width:210mm!important;height:297mm!important;padding:6mm 7mm 4mm!important;margin:0!important;background:#fff;display:block!important}.copy{width:196mm!important;height:92mm!important;box-sizing:border-box!important;border:1px solid #111;margin:0 0 2.5mm 0!important;position:relative;overflow:hidden;font-size:8.2px;page-break-inside:avoid;break-inside:avoid;display:block!important}.copy:last-child{margin-bottom:0!important}.copy-header{height:14.5%;border-bottom:1px solid #111;position:relative;text-align:center;padding-top:2mm}.copy-header .company{font-size:14px;font-weight:900;line-height:1.1}.copy-header .address{font-size:7.5px;font-weight:600;margin-top:1mm}.copy-header .gst{font-size:8px;font-weight:800;margin-top:.6mm}.copy-header .copyname{font-size:9px;font-weight:900;margin-top:.5mm;letter-spacing:.2px}.copy-header .copytype{font-size:7px;font-weight:800;margin-top:.3mm}.meta{height:11%;display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid #111}.meta>div{padding:1.5mm;border-right:1px solid #111}.meta>div:last-child{border-right:0}.main{height:54%;display:grid;grid-template-columns:38% 37% 25%;border-bottom:1px solid #111}.panel{border-right:1px solid #111}.panel:last-child{border-right:0}.p{padding:1.2mm 1.5mm;border-bottom:1px solid #111;min-height:6mm}.p:last-child{border-bottom:0}.label{font-weight:800}.goods-title{display:grid;grid-template-columns:13% 52% 35%;font-weight:900;text-align:center;border-bottom:1px solid #111}.goods-title>div{padding:1.2mm;border-right:1px solid #111}.goods-title>div:last-child{border-right:0}.goods-lines{min-height:22mm;padding:1mm 0}.goods-row{display:grid;grid-template-columns:13% 52% 35%;min-height:4.2mm}.goods-row>div{padding:0 1.2mm;border-right:1px solid #ddd}.goods-row>div:last-child{border-right:0}.charge{display:grid;grid-template-columns:62% 38%;border-bottom:1px solid #111}.charge>div{padding:1mm 1.5mm;border-right:1px solid #111}.charge>div:last-child{border-right:0}.chargebox{display:grid;grid-template-columns:1fr 1fr}.chargebox div{padding:1mm 1.5mm;border-bottom:1px solid #111}.chargebox div:nth-child(odd){border-right:1px solid #111}.total{font-size:12px;font-weight:900}.foot{height:20.8%;position:relative}.footline{padding:1mm 1.5mm;border-bottom:1px solid #111;min-height:5.5mm}.signs{position:absolute;left:1.5mm;right:1.5mm;bottom:2mm;display:flex;justify-content:space-between;font-weight:800;font-size:7px}.small{font-size:7px}.nonneg{position:absolute;right:1.5mm;bottom:6mm;font-weight:800;font-size:7px}
}
</style></head><body>
<div class="top"><div class="topin"><b>🧾 NRT ONLINE BILTY / LR</b><a href="index.html">← Website</a></div></div>
<div class="wrap">
<div class="box" id="loginBox"><h2 class="title">NRT Staff Login</h2><div class="grid"><div><label>Email</label><input id="email" type="email" placeholder="NRT account email"></div><div><label>Password</label><input id="password" type="password" placeholder="Password"></div></div><div class="actions"><button class="blue" onclick="login()">Login</button><button class="gray" onclick="signup()">Create account</button></div><div id="loginMsg" class="msg"></div></div>
<div id="app" style="display:none">
<div class="box"><h2 class="title">Create New Bilty / LR</h2>
<div class="grid">
<div><label>LR Number</label><input id="lr_no" readonly></div><div><label>LR Date</label><input id="lr_date" type="date"></div>
<div><label>Vehicle Number</label><input id="vehicle_no" placeholder="TS / TG 00 XX 0000"></div><div><label>Delivery Type</label><select id="delivery_type"><option>One Day Delivery</option><option>Door Delivery</option><option>Regular Transport</option></select></div>
<div><label>From</label><input id="from_location" value="Hyderabad"></div><div><label>To</label><input id="to_location" placeholder="Destination"></div>
<div><label>Consignor Name</label><input id="consignor_name"></div><div><label>Consignor Phone</label><input id="consignor_phone"></div>
<div><label>Consignor GST</label><input id="consignor_gst"></div><div><label>Consignee Name</label><input id="consignee_name"></div>
<div><label>Consignee Phone</label><input id="consignee_phone"></div><div><label>Consignee GST</label><input id="consignee_gst"></div>
<div><label>Packages</label><input id="packages" type="number" min="0" value="1"></div><div><label>Weight (Kg)</label><input id="weight" type="number" min="0" step="0.01"></div>
<div><label>Actual Weight</label><input id="actual_weight" type="number" min="0" step="0.01"></div><div><label>Charged Weight</label><input id="charged_weight" type="number" min="0" step="0.01"></div>
<div class="full"><label>Goods Description</label><input id="goods" placeholder="Seeds / Auto Parts / Medicine / Machinery / General Goods"></div>
<div><label>Invoice No.</label><input id="invoice_no"></div><div><label>Invoice Value (₹)</label><input id="invoice_value" type="number" min="0" value="0"></div>
<div><label>E-Way Bill No.</label><input id="eway_bill"></div><div><label>Delivery At</label><input id="delivery_at" placeholder="Godown / Door / Office"></div>
<div><label>Freight (₹)</label><input id="freight" type="number" min="0" value="0"></div><div><label>Stationary (₹)</label><input id="stationary" type="number" min="0" value="0"></div>
<div><label>Hamali (₹)</label><input id="hamali" type="number" min="0" value="0"></div><div><label>Door Pickup (₹)</label><input id="door_pickup" type="number" min="0" value="0"></div>
<div><label>Door Delivery (₹)</label><input id="door_delivery" type="number" min="0" value="0"></div><div><label>Insurance (₹)</label><input id="insurance" type="number" min="0" value="0"></div>
<div><label>Other (₹)</label><input id="other_charges" type="number" min="0" value="0"></div><div><label>GST Paid By</label><select id="gst_paid_by"><option>Not Applicable</option><option>Consignor</option><option>Consignee</option><option>NRT</option></select></div>
<div class="full"><label>Remarks</label><textarea id="remarks"></textarea></div>
</div><div class="actions"><button class="yellow" onclick="saveLR()">💾 Save LR</button><button class="blue" onclick="printLR()">🖨️ A4 3 Copies</button><button class="gray" onclick="clearForm()">New</button><button class="danger" onclick="logout()">Logout</button></div><div id="msg" class="msg"></div></div>
<div class="box"><h2 class="title">LR Search / Records</h2><div class="search"><input id="search" placeholder="Search LR number, consignee, vehicle, destination..." oninput="loadRecords()"><button class="blue" onclick="loadRecords()">Search</button></div><div class="tablewrap"><table><thead><tr><th>LR</th><th>Date</th><th>Vehicle</th><th>To</th><th>Consignee</th><th>Status</th><th>Print</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div></div>
<div id="printArea" class="printarea"></div>
<script>
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let current=null;const $=id=>document.getElementById(id);function configured(){return SUPABASE_URL.startsWith("http")&&!SUPABASE_PUBLISHABLE_KEY.includes("PASTE_")}function today(){return new Date().toISOString().slice(0,10)}
async function login(){if(!configured())return setLogin("First fill supabase-config.js with Project URL and Publishable Key.");let{data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return setLogin(error.message);setLogin("Logged in.");showApp()}async function signup(){if(!configured())return setLogin("First configure Supabase.");let{error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});setLogin(error?error.message:"Account created. Check email if confirmation is enabled.")}function setLogin(x){$('loginMsg').textContent=x}async function logout(){await sb.auth.signOut();$('app').style.display='none';$('loginBox').style.display='block'}async function showApp(){let{data:{session}}=await sb.auth.getSession();if(!session)return;$('loginBox').style.display='none';$('app').style.display='block';$('lr_date').value=today();$('lr_no').value='NRT/45243';loadRecords()}async function nextLR(){let{data,error}=await sb.rpc('next_nrt_lr_no');if(error){$('msg').textContent=error.message;return null}$('lr_no').value=data;return data}function val(id){return $(id).value.trim()}function num(id){return Number(val(id)||0)}
function makeRow(){return{lr_no:val('lr_no'),lr_date:val('lr_date'),vehicle_no:val('vehicle_no'),from_location:val('from_location'),to_location:val('to_location'),delivery_type:val('delivery_type'),consignor_name:val('consignor_name'),consignor_phone:val('consignor_phone'),consignee_name:val('consignee_name'),consignee_phone:val('consignee_phone'),packages:num('packages'),weight:num('weight'),goods:val('goods'),freight:num('freight'),other_charges:num('other_charges'),remarks:val('remarks'),status:'Booked'}}
async function saveLR(){let{data:generated,error:genError}=await sb.rpc('next_nrt_lr_no');if(genError){$('msg').textContent=genError.message;return}$('lr_no').value=generated;let row=makeRow();let{error}=await sb.from('lrs').insert(row);if(error){$('msg').textContent=error.message;return}$('msg').textContent=`${row.lr_no} saved successfully.`;printLR();loadRecords()}
async function loadRecords(){if(!(await sb.auth.getSession()).data.session)return;let q=val('search'),query=sb.from('lrs').select('*').order('id',{ascending:false}).limit(100);if(q)query=query.or(`lr_no.ilike.%${q}%,vehicle_no.ilike.%${q}%,to_location.ilike.%${q}%,consignee_name.ilike.%${q}%`);let{data,error}=await query;if(error){$('rows').innerHTML=`<tr><td colspan="7">${error.message}</td></tr>`;return}$('rows').innerHTML=(data||[]).map(r=>`<tr><td><b>${r.lr_no}</b></td><td>${r.lr_date||''}</td><td>${r.vehicle_no||''}</td><td>${r.to_location||''}</td><td>${r.consignee_name||''}</td><td><span class="badge">${r.status}</span></td><td><button class="gray" onclick='printRecord(${JSON.stringify(r).replace(/'/g,'&#39;')})'>Print</button></td></tr>`).join('')}
function clearForm(){['vehicle_no','to_location','consignor_name','consignor_phone','consignor_gst','consignee_name','consignee_phone','consignee_gst','actual_weight','charged_weight','goods','invoice_no','eway_bill','delivery_at','remarks'].forEach(x=>$(x).value='');['packages'].forEach(x=>$(x).value=1);['weight','invoice_value','freight','stationary','hamali','door_pickup','door_delivery','insurance','other_charges'].forEach(x=>$(x).value=0);$('lr_date').value=today();$('lr_no').value='Next LR will be generated on Save';$('msg').textContent=''}
function printLR(){renderPrint(makePrintObject());window.print()}function printRecord(r){renderPrint(r);window.print()}
function makePrintObject(){return{lr_no:val('lr_no'),lr_date:val('lr_date'),vehicle_no:val('vehicle_no'),from_location:val('from_location'),to_location:val('to_location'),delivery_type:val('delivery_type'),consignor_name:val('consignor_name'),consignor_phone:val('consignor_phone'),consignee_name:val('consignee_name'),consignee_phone:val('consignee_phone'),packages:val('packages'),weight:val('weight'),actual_weight:val('actual_weight')||val('weight'),charged_weight:val('charged_weight')||val('weight'),goods:val('goods'),invoice_no:val('invoice_no'),invoice_value:val('invoice_value'),eway_bill:val('eway_bill'),delivery_at:val('delivery_at'),freight:val('freight'),stationary:val('stationary'),hamali:val('hamali'),door_pickup:val('door_pickup'),door_delivery:val('door_delivery'),insurance:val('insurance'),other_charges:val('other_charges'),gst_paid_by:val('gst_paid_by'),remarks:val('remarks')}}
function money(x){return '₹'+Number(x||0).toLocaleString('en-IN')}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderPrint(r){let copies=['CONSIGNOR COPY','CONSIGNEE COPY','TRANSPORTER COPY'];let total=['freight','stationary','hamali','door_pickup','door_delivery','insurance','other_charges'].reduce((a,k)=>a+Number(r[k]||0),0);let goods=esc(r.goods);$('printArea').innerHTML=`<div class="sheet">${copies.map((c,i)=>`<div class="copy"><div class="copy-header"><div class="company">NANDHISHWARA ROAD TRANSPORT</div><div class="address">Plot No 1, Block No 3, Autonagar, Hyderabad, Telangana 500070</div><div class="gst">Mobile No : 9885410410 / 9989581732 &nbsp;&nbsp; GST : 36HSYPK0996J1ZM</div><div class="copyname">ONE DAY DELIVERY SERVICE</div><div class="copytype">${c}</div></div><div class="meta"><div><b>Date:</b> ${esc(r.lr_date)}</div><div><b>LR No:</b> <b>${esc(r.lr_no)}</b></div><div><b>Freight Type:</b> TO PAY</div></div><div class="main"><div class="panel"><div class="p"><b>FROM:</b> ${esc(r.from_location)}</div><div class="p"><b>Consignor:</b> ${esc(r.consignor_name)}<br><b>Mobile No:</b> ${esc(r.consignor_phone)}</div><div class="p"><b>Qty:</b> ${esc(r.packages)}</div><div class="goods-title"><div>Qty.</div><div>DESCRIPTION</div><div>Goods / Remarks</div></div><div class="goods-lines"><div class="goods-row"><div>${esc(r.packages)}</div><div>${goods}</div><div>${esc(r.remarks)}</div></div></div></div><div class="panel"><div class="p"><b>TO:</b> ${esc(r.to_location)}</div><div class="p"><b>Consignee:</b> ${esc(r.consignee_name)}<br><b>Mobile No:</b> ${esc(r.consignee_phone)}</div><div class="p"><b>INV:</b> ${esc(r.invoice_no)} &nbsp;&nbsp; <b>VALUE:</b> ${money(r.invoice_value)}</div><div class="p"><b>Actual Wt:</b> ${esc(r.actual_weight)} &nbsp;&nbsp; <b>Charged Wt:</b> ${esc(r.charged_weight)}</div><div class="p"><b>Delivery At:</b> ${esc(r.delivery_at)}</div><div class="p"><b>Ewaybill No.:</b> ${esc(r.eway_bill)}</div></div><div class="panel"><div class="chargebox"><div><b>Freight</b></div><div>${money(r.freight)}</div><div><b>Stationary</b></div><div>${money(r.stationary)}</div><div><b>Hamali</b></div><div>${money(r.hamali)}</div><div><b>Door Pickup</b></div><div>${money(r.door_pickup)}</div><div><b>Door Dly.</b></div><div>${money(r.door_delivery)}</div><div><b>Insurance</b></div><div>${money(r.insurance)}</div><div><b>Other</b></div><div>${money(r.other_charges)}</div></div><div class="p total">Total <span style="float:right">${money(total)}</span></div><div class="p"><b>Delivery:</b> ${esc(r.delivery_type)}</div></div></div><div class="foot"><div class="footline"><b>Remark:</b> ${esc(r.remarks)}</div><div class="footline"><b>GST Paid By:</b> ${esc(r.gst_paid_by)}</div><div class="nonneg">Non Negotiable</div><div class="footline small">Goods booked at Owner's risk and said to contain basis.</div><div class="signs"><span>Consignor Signature</span><span>Receiver Signature</span><span>For NRT</span></div></div></div>`).join('')}</div>`}
sb.auth.onAuthStateChange((event,session)=>{if(session)showApp()});if(configured())sb.auth.getSession().then(x=>{if(x.data.session)showApp()});else $('loginMsg').textContent='Supabase setup pending — configure the project keys first.';
</script></body></html>
